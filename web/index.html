<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Tracery</title>
<link rel="icon" href="/tracery.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="topbar">
  <button class="brand" id="brand-home" title="回到主页并刷新">
    <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <rect width="32" height="32" rx="7" fill="var(--brand-plate)"/>
      <g fill="none" stroke="var(--brand-web)" stroke-width="1.5" stroke-linecap="round">
        <path d="M23 11.5 30 4.5"/>
        <path d="M24 14.5 31 9.5"/>
        <path d="M26 17 30 14.5"/>
        <path d="M25 10 28.5 13"/>
        <path d="M26.5 13 29 16"/>
      </g>
      <g fill="none" stroke="var(--brand-ink)" stroke-width="1.9" stroke-linecap="round">
        <path d="M19 16.4 23.6 11.4"/>
        <path d="M20.8 18.6 25 13.6"/>
      </g>
      <ellipse cx="13" cy="20" rx="9.4" ry="7.2" fill="var(--brand-ink)"/>
      <g fill="none" stroke="var(--brand-ink)" stroke-width="2.2" stroke-linecap="round">
        <path d="M6.5 25.4 5 29.6"/>
        <path d="M10.5 26.4 9.8 30.4"/>
        <path d="M15.5 26.4 16.2 30.4"/>
        <path d="M19.5 25.4 21 29.6"/>
      </g>
      <ellipse cx="9.2" cy="18.2" rx="2.8" ry="3.2" fill="var(--brand-web)"/>
      <ellipse cx="16.8" cy="18.2" rx="2.8" ry="3.2" fill="var(--brand-web)"/>
      <path d="M11.9 23.6q1.4 1.3 3 0" fill="none" stroke="var(--brand-web)" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span>Tracery</span>
  </button>
  <div class="crumb" id="crumb"></div>
  <div class="grow"></div>
  <div class="toolbar-right">
    <span id="backend-slot"></span>
    <button class="icon-btn" id="sidebar-toggle" aria-controls="sessions-col" aria-expanded="true" aria-label="收起会话栏" title="收起会话栏"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.6"/><path d="M6.2 3.4v9.2"/></svg></button>
    <button class="icon-btn" id="rail-toggle" aria-controls="rail-col" aria-expanded="true" aria-label="收起详情栏" title="收起详情栏"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.6"/><path d="M9.8 3.4v9.2"/></svg></button>
    <button class="icon-btn" id="theme-toggle" aria-label="切换主题" title="切换主题"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="3.1"/><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.3 3.3l1.1 1.1M11.6 11.6l1.1 1.1M12.7 3.3l-1.1 1.1M4.4 11.6l-1.1 1.1"/></svg></button>
  </div>
</header>

<div class="app">
  <aside class="col col-sessions" id="sessions-col" aria-label="会话列表">
    <div class="sessions-head">
      <div class="sessions-title"><h2>会话</h2><span id="sess-count"></span></div>
      <div class="search">
        <svg class="ico" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="1.5"/></svg>
        <input id="sess-search" type="search" placeholder="搜索已加载会话、请求或 ID" aria-label="搜索已加载会话">
      </div>
      <div class="filters" id="agent-filters" role="group" aria-label="按 Agent 筛选"></div>
    </div>
    <div class="sessions-list" id="sessions-list"><p class="sess-empty">正在读取本机会话…</p></div>
  </aside>

  <main class="col col-main" id="main"><p class="sess-empty" style="padding:24px">正在读取请求…</p></main>

  <div class="resize-handle" id="rail-resize" role="separator" tabindex="0" aria-label="调整详情栏宽度" aria-orientation="vertical" aria-valuemin="280" aria-valuemax="640" aria-valuenow="640" title="拖动调整宽度；双击恢复默认；方向键微调"></div>

  <aside class="col col-rail" id="rail-col" aria-label="请求读数与正文">
    <div class="rail-head" id="rail-head"></div>
    <div class="rail-body" id="rail-body"><div class="rail-empty"><svg class="ico" width="24" height="24" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2.6" y="3.4" width="10.8" height="9.2" rx="1.6"/><path d="M9.4 8H4.6M6.6 6l-2 2 2 2"/></svg><b>等待选择</b>数据到达后再显示读数。</div></div>
  </aside>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
