<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Trace Collector</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="topbar">
  <button class="brand" id="brand-home" title="回到主页并刷新">
    <svg width="20" height="22" viewBox="0 0 30 32" fill="none" aria-hidden="true"><path d="M5 4v24M5 9h12l8 7-8 7H5" stroke="currentColor" stroke-width="2.4"/><circle cx="5" cy="9" r="2.6" fill="currentColor"/><circle cx="25" cy="16" r="2.6" fill="currentColor"/><circle cx="5" cy="23" r="2.6" fill="currentColor"/></svg>
    <span>Trace Collector</span>
  </button>
  <div class="crumb" id="crumb"></div>
  <div class="grow"></div>
  <div class="toolbar-right">
    <button class="icon-btn" id="sidebar-toggle" aria-controls="sessions-col" aria-expanded="true" aria-label="收起会话栏" title="收起会话栏">☷</button>
    <button class="icon-btn" id="rail-toggle" aria-controls="rail-col" aria-expanded="true" aria-label="收起详情栏" title="收起详情栏">◨</button>
    <button class="icon-btn" id="theme-toggle" aria-label="切换主题" title="切换主题">◐</button>
  </div>
</header>

<div class="app">
  <aside class="col col-sessions" id="sessions-col" aria-label="会话列表">
    <div class="sessions-head">
      <div class="sessions-title"><h2>会话</h2><span id="sess-count"></span></div>
      <div class="search">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="1.5"/></svg>
        <input id="sess-search" type="search" placeholder="搜索已加载会话、请求或 ID" aria-label="搜索已加载会话">
      </div>
      <div class="filters" id="agent-filters" role="group" aria-label="按 Agent 筛选"></div>
      <button class="chip-btn" id="load-more-sessions" hidden>加载更多会话</button>
    </div>
    <div class="sessions-list" id="sessions-list"><p class="sess-empty">正在读取本机会话…</p></div>
  </aside>

  <main class="col col-main" id="main"><p class="sess-empty" style="padding:24px">正在读取请求…</p></main>

  <div class="resize-handle" id="rail-resize" role="separator" tabindex="0" aria-label="调整详情栏宽度" aria-orientation="vertical" aria-valuemin="280" aria-valuemax="640" aria-valuenow="640" title="拖动调整宽度；双击恢复默认；方向键微调"></div>

  <aside class="col col-rail" id="rail-col" aria-label="请求读数与正文">
    <div class="rail-head" id="rail-head"></div>
    <div class="rail-body" id="rail-body"><div class="rail-empty"><b>等待选择</b>数据到达后再显示读数。</div></div>
  </aside>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
