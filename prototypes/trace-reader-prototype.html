<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Trace Collector</title>
<style>
/* ------------------------------------------------------------------
   Token：证据仪表盘。深色与浅色是两套成对表面，不是反色。
   accent 只表示选中与当前路径，不表示成功；状态色只用于状态。
   ------------------------------------------------------------------ */
:root{
  color-scheme:light;
  --page:#f2f6f8; --canvas:#edf2f5; --surface:#ffffff;
  --inset:#f4f7f9; --hover:#e8eff3; --line:#d9e2e9; --line-strong:#b7c6d1;
  --text:#15232d; --text-2:#4d6372; --muted:#6d7d88;
  --accent:#007f83; --accent-strong:#005d61; --accent-soft:rgba(0,127,131,.10);
  --good:#167a4f; --warn:#99600a; --bad:#b32e37; --missing:#667580;
  --good-soft:rgba(22,122,79,.10); --warn-soft:rgba(153,96,10,.12); --bad-soft:rgba(179,46,55,.10);
  --k-system:#6b4fbb; --k-user:#1c7a4f; --k-assistant:#9a6206; --k-tool:#0f6f78; --k-field:#5c6c7a;
  --k-system-bg:rgba(107,79,187,.10); --k-user-bg:rgba(28,122,79,.10); --k-assistant-bg:rgba(154,98,6,.12);
  --k-tool-bg:rgba(15,111,120,.10); --k-field-bg:rgba(92,108,122,.10);
  /* 六类上下文：固定槽位，不按大小重排；顺序即调色板校验过的相邻顺序 */
  --p1:#2a78d6; --p2:#eb6834; --p3:#1baf7a; --p4:#eda100; --p5:#e87ba4; --p6:#008300;
  --shadow:0 1px 2px rgba(16,32,48,.06);
  --ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0b1118; --canvas:#101923; --surface:#151f2a;
    --inset:#0a0f15; --hover:#202f3d; --line:#263645; --line-strong:#3b4d5f;
    --text:#e9f1f7; --text-2:#a7b8c6; --muted:#738595;
    --accent:#64dad7; --accent-strong:#9cf0ec; --accent-soft:rgba(100,218,215,.12);
    --good:#59d88d; --warn:#f1c46b; --bad:#f27a7a; --missing:#8797a5;
    --good-soft:rgba(89,216,141,.12); --warn-soft:rgba(241,196,107,.12); --bad-soft:rgba(242,122,122,.12);
    --k-system:#b6a3f0; --k-user:#8fd8ae; --k-assistant:#e6c07a; --k-tool:#7fd4d9; --k-field:#93a5b3;
    --k-system-bg:rgba(182,163,240,.13); --k-user-bg:rgba(143,216,174,.12); --k-assistant-bg:rgba(230,192,122,.13);
    --k-tool-bg:rgba(127,212,217,.12); --k-field-bg:rgba(147,165,179,.12);
    --p1:#3987e5; --p2:#d95926; --p3:#199e70; --p4:#c98500; --p5:#d55181; --p6:#008300;
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0b1118; --canvas:#101923; --surface:#151f2a;
  --inset:#0a0f15; --hover:#202f3d; --line:#263645; --line-strong:#3b4d5f;
  --text:#e9f1f7; --text-2:#a7b8c6; --muted:#738595;
  --accent:#64dad7; --accent-strong:#9cf0ec; --accent-soft:rgba(100,218,215,.12);
  --good:#59d88d; --warn:#f1c46b; --bad:#f27a7a; --missing:#8797a5;
  --good-soft:rgba(89,216,141,.12); --warn-soft:rgba(241,196,107,.12); --bad-soft:rgba(242,122,122,.12);
  --k-system:#b6a3f0; --k-user:#8fd8ae; --k-assistant:#e6c07a; --k-tool:#7fd4d9; --k-field:#93a5b3;
  --k-system-bg:rgba(182,163,240,.13); --k-user-bg:rgba(143,216,174,.12); --k-assistant-bg:rgba(230,192,122,.13);
  --k-tool-bg:rgba(127,212,217,.12); --k-field-bg:rgba(147,165,179,.12);
  --p1:#3987e5; --p2:#d95926; --p3:#199e70; --p4:#c98500; --p5:#d55181; --p6:#008300;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--canvas);color:var(--text);
  font:13px/1.55 var(--ui);
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;border-radius:3px;
}
h1,h2,h3,p{margin:0}
code,pre,.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono);letter-spacing:-.01em}
.muted{color:var(--muted)}
.sep{color:var(--line-strong)}
.label{font:500 10px/1.3 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* ---------- 顶栏：一条 52px 的仪器横条，不做首屏大标题 ---------- */
.topbar{
  flex:none;height:52px;display:flex;align-items:center;gap:14px;
  padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);
  position:relative;z-index:5;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;white-space:nowrap}
.brand svg{color:var(--accent);flex:none}
.brand em{font-style:normal;color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.04em}
.crumb{display:flex;align-items:center;gap:7px;min-width:0;font-size:12px;color:var(--text-2)}
.crumb b{font-weight:550;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34ch}
.grow{flex:1;min-width:8px}
.toolbar-right{display:flex;align-items:center;gap:6px}
.demo-tag{
  font:500 10px/1 var(--ui);letter-spacing:.07em;color:var(--accent);
  border:1px solid var(--accent);border-radius:3px;padding:3px 5px;white-space:nowrap;
}
.icon-btn{
  height:28px;min-width:28px;border:1px solid var(--line);border-radius:4px;background:var(--surface);
  display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);font-size:12px;padding:0 8px;
}
.icon-btn:hover{background:var(--hover)}

/* ---------- 三栏工作台：每栏独立滚动 ---------- */
.app{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr) 348px}
.col{min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain}
.col-sessions{background:var(--page);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.col-main{background:var(--canvas)}
.col-rail{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}

/* ---------- 左栏：会话 ---------- */
.sessions-head{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;flex:none}
.sessions-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sessions-title h2{font-size:12.5px;font-weight:600;letter-spacing:.02em}
.sessions-title span{font-size:11px;color:var(--muted)}
.search{position:relative}
.search input{
  width:100%;height:30px;border:1px solid var(--line);border-radius:4px;background:var(--surface);
  padding:0 8px 0 26px;font-size:12px;color:var(--text);
}
.search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.chip-btn{
  font-size:11px;padding:3px 7px;border:1px solid var(--line);border-radius:3px;color:var(--text-2);
  background:var(--surface);white-space:nowrap;
}
.chip-btn:hover{background:var(--hover)}
.chip-btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.sessions-list{flex:1;min-height:0;overflow:auto;padding:2px 8px 16px}
.group-label{
  display:flex;align-items:center;gap:6px;padding:10px 6px 5px;
  font:500 10px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
}
.group-label::after{content:"";flex:1;height:1px;background:var(--line)}
.sess{
  display:grid;grid-template-columns:1fr auto;gap:1px 8px;width:100%;
  padding:8px 8px 8px 9px;border-radius:4px;border-left:2px solid transparent;margin-bottom:1px;
}
.sess:hover{background:var(--hover)}
.sess[aria-current="true"]{background:var(--surface);border-left-color:var(--accent);box-shadow:var(--shadow)}
.sess-title{font-size:12.5px;font-weight:550;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-meta{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);min-width:0}
.sess-meta .dot{width:5px;height:5px;border-radius:50%;flex:none}
.sess-meta .who{color:var(--text-2);white-space:nowrap}
.sess-time{font-size:10.5px;color:var(--muted);align-self:start;padding-top:1px}
.sess-empty{padding:16px 8px;font-size:12px;color:var(--muted)}

/* ---------- 中栏：会话头 ---------- */
.session-head{padding:14px 20px 12px;border-bottom:1px solid var(--line);background:var(--canvas);position:sticky;top:0;z-index:3}
.session-head .eyebrow{font:500 10px var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.session-head h1{font-size:17px;line-height:1.35;font-weight:600;margin-top:3px;letter-spacing:-.01em}
.session-facts{display:flex;flex-wrap:wrap;align-items:center;gap:5px 12px;margin-top:7px;font-size:11px;color:var(--muted)}
.session-facts b{font-weight:550;color:var(--text-2)}
.session-facts .mono{font-size:10.5px}
.session-facts .sum{color:var(--text-2)}
.session-note{
  margin-top:9px;padding:6px 9px;border-radius:4px;border:1px solid var(--line);
  background:var(--surface);font-size:11px;color:var(--text-2);display:flex;gap:7px;align-items:flex-start;
}
.session-note.warn{border-color:var(--warn);background:var(--warn-soft)}
.view-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.view-row .hint{font-size:10.5px;color:var(--muted)}

/* ---------- 分段控件 ---------- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface)}
.seg button{font-size:11px;padding:4px 9px;color:var(--text-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:550}

/* ---------- 对话视图：按请求分组，USER / ASSISTANT 交替 ---------- */
.conv{padding:16px 20px 48px;max-width:940px;position:relative}
.conv::before{content:"";position:absolute;left:76px;top:44px;bottom:40px;width:1px;background:var(--line)}
.conv-note{font-size:10.5px;color:var(--muted);margin-bottom:16px;display:flex;gap:7px;align-items:flex-start;line-height:1.65}
.conv-req{position:relative;display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px;padding-bottom:20px}
.conv-req:last-child{padding-bottom:0}
.conv-gutter{padding-top:2px;text-align:right;font:10px var(--mono);color:var(--muted);white-space:nowrap;line-height:1.5;z-index:1}
.conv-gutter b{display:inline-block;background:var(--canvas);color:var(--text-2);font-weight:500;padding:0 2px;font-size:10px}
.conv-gutter em{font-style:normal;display:block;color:var(--muted);font-size:9.5px}
.conv-main{min-width:0;display:flex;flex-direction:column;gap:10px}
.conv-who{font:600 9.5px var(--ui);letter-spacing:.1em}
.conv-user .conv-who{color:var(--k-user)}
.conv-assistant .conv-who{color:var(--k-assistant)}
.conv-user-body{
  font-size:13px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text);
  border-left:2px solid var(--line-strong);padding-left:11px;max-width:74ch;
}
.conv-user{cursor:pointer}
.conv-user:hover .conv-user-body{border-left-color:var(--k-user)}
.conv-asst-card{
  border:1px solid var(--line);border-radius:7px;background:var(--surface);box-shadow:var(--shadow);
  overflow:hidden;max-width:760px;cursor:pointer;
}
.conv-asst-card:hover{border-color:var(--line-strong)}
.conv-req[data-current="true"] .conv-asst-card{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft)}
.conv-req[data-current="true"] .conv-user-body{border-left-color:var(--k-user)}
.conv-asst-head{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid var(--line);background:var(--inset);flex-wrap:wrap}
.conv-asst-body{padding:10px 12px;font-size:13px;line-height:1.75;overflow-wrap:anywhere;max-width:76ch}
.conv-strip{display:flex;flex-wrap:wrap;gap:3px 11px;padding:7px 11px;border-top:1px solid var(--line);font-size:10.5px;color:var(--text-2);background:var(--surface)}
.conv-strip b{font:10.5px var(--mono);font-weight:500;color:var(--text)}
.conv-tools{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:9px 11px}
.conv-tools .label{flex:none;margin-right:1px}
.tool-chip{
  display:inline-flex;align-items:center;gap:5px;font:10.5px var(--mono);padding:3px 6px;
  border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--text-2);max-width:100%;
}
.tool-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-chip.call{border-color:var(--k-assistant);color:var(--k-assistant);background:var(--k-assistant-bg)}
.tool-chip.res{border-color:var(--k-tool);color:var(--k-tool);background:var(--k-tool-bg)}
.tool-chip.miss{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.conv-fail{padding:11px 12px;font-size:12px;color:var(--bad);display:flex;gap:8px;align-items:flex-start;line-height:1.6}
.conv-jump{font-size:10.5px;color:var(--accent);padding:2px 0 0;align-self:flex-start;opacity:0;transition:opacity .1s}
.conv-req:hover .conv-jump,.conv-req[data-current="true"] .conv-jump{opacity:1}
.conv-jump:hover{text-decoration:underline}
.conv-jump:focus-visible{opacity:1}
@media(hover:none){.conv-jump{opacity:1}}
.conv-tools details{padding:0 11px 9px;width:100%;cursor:default}
.conv-tools details summary{font-size:10.5px;color:var(--muted);cursor:pointer}
.conv-tools details summary:hover{color:var(--text)}
.conv-tools details pre{margin-top:7px}

/* ---------- 账本 ---------- */
.ledger{position:relative;padding:10px 20px 28px 20px}
.ledger::before{content:"";position:absolute;left:27px;top:12px;bottom:22px;width:1px;background:var(--line)}
.req{position:relative;margin-bottom:4px;scroll-margin-top:168px}
.req-head{
  display:grid;grid-template-columns:14px 56px minmax(0,1fr) auto;gap:0 10px;align-items:center;
  width:100%;padding:8px 10px 8px 0;border-radius:4px;
}
.req-head:hover{background:var(--hover)}
.req:not([data-open="true"]) .req-head{padding-block:9px}
.req-node{width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--line-strong);justify-self:center;z-index:1}
.req[data-status="success"] .req-node{border-color:var(--good)}
.req[data-status="failed"] .req-node{border-color:var(--bad);background:var(--bad)}
.req[data-status="incomplete"] .req-node{border-color:var(--warn);background:var(--warn-soft)}
.req[data-status="unknown"] .req-node{border-color:var(--missing);border-style:dashed}
.req[aria-current="true"] .req-node{border-color:var(--accent);background:var(--accent)}
.req-time{font:11px var(--mono);color:var(--muted);white-space:nowrap}
.req-line{min-width:0;display:flex;flex-direction:column;gap:2px}
.req-title{font-size:13px;line-height:1.4;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.req-sub{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center;min-width:0}
.req-sub span:last-child{overflow:hidden;text-overflow:ellipsis}
.req-metrics{display:flex;align-items:center;gap:10px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.req-metrics .num{font-size:10.5px}
.req-flag{font-size:10px;padding:1px 5px;border-radius:3px;border:1px solid currentColor;white-space:nowrap;flex:none}
.req-flag.bad{color:var(--bad)} .req-flag.warn{color:var(--warn)} .req-flag.mute{color:var(--muted)}
.req-open-mark{color:var(--muted);width:12px;display:inline-flex;justify-content:center}
.req-open-mark svg{transition:transform .12s}
.req[data-open="true"] .req-open-mark svg{transform:rotate(90deg)}

.req-body{
  margin:2px 0 10px 24px;border:1px solid var(--line);border-radius:7px;background:var(--surface);
  box-shadow:var(--shadow);overflow:hidden;
}
.body-top{
  display:flex;flex-wrap:wrap;align-items:center;gap:5px 10px;
  padding:9px 12px;border-bottom:1px solid var(--line);background:var(--inset);
}
.body-top .id{font:10.5px var(--mono);color:var(--muted)}
.body-top .grow{flex:1}
.state-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:2px 6px;border-radius:3px;border:1px solid currentColor;flex:none}
.state-chip.ok{color:var(--good);background:var(--good-soft)}
.state-chip.bad{color:var(--bad);background:var(--bad-soft)}
.state-chip.warn{color:var(--warn);background:var(--warn-soft)}
.state-chip.mute{color:var(--muted);background:var(--inset)}
.state-chip .d{width:5px;height:5px;border-radius:50%;background:currentColor}

.section{padding:12px 12px 0}
.section:last-child{padding-bottom:12px}
.section-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-height:24px;flex-wrap:wrap}
.section-head h3{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.section-head .count{font:10.5px var(--mono);color:var(--muted)}
.section-head .grow{flex:1}
.mini-search{height:24px;border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:0 7px;font-size:11px;width:150px}

/* 路径表：固定行高，长内容不撑高 */
.path-table{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.path-head,.path-row{
  display:grid;grid-template-columns:26px 112px 60px minmax(0,1fr) 40px;
  gap:8px;align-items:center;padding:0 10px;
}
.path-head{
  height:26px;background:var(--inset);border-bottom:1px solid var(--line);
  font:500 9.5px var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
}
.path-scroll{max-height:min(46vh,430px);overflow:auto;overscroll-behavior:contain}
.path-row{
  height:29px;width:100%;border-bottom:1px solid var(--line);
  border-left:2px solid transparent;font-size:12px;
}
.path-row:last-child{border-bottom:0}
.path-row:hover{background:var(--hover)}
.path-row[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.path-row[data-new="true"] .path-idx{color:var(--accent)}
.path-idx{font:10px var(--mono);color:var(--muted);text-align:right}
.path-name{font:10px var(--mono);color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind{
  display:inline-block;font:500 9px/1 var(--mono);letter-spacing:.05em;padding:3px 4px;border-radius:2px;
  text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.kind.SYSTEM{color:var(--k-system);background:var(--k-system-bg)}
.kind.USER{color:var(--k-user);background:var(--k-user-bg)}
.kind.ASSISTANT,.kind.CALL{color:var(--k-assistant);background:var(--k-assistant-bg)}
.kind.TOOL,.kind.SCHEMA{color:var(--k-tool);background:var(--k-tool-bg)}
.kind.FIELD,.kind.PARAM{color:var(--k-field);background:var(--k-field-bg)}
.kind.REPLY{color:var(--accent);background:var(--accent-soft);font-weight:600}
.path-preview{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.path-row[data-dim="true"] .path-preview{color:var(--muted)}
.path-flag{font:9px var(--ui);color:var(--accent);text-align:right;white-space:nowrap}
.path-row.search-hit .path-preview{background:var(--warn-soft);box-shadow:inset 0 -1px var(--warn)}

.delta-note{
  display:flex;gap:7px;align-items:flex-start;padding:7px 9px;margin-top:8px;
  border:1px dashed var(--line-strong);border-radius:4px;font-size:10.5px;color:var(--muted);
}

<script>
/* ==================================================================
   合成演示数据。不连接 magpie，不读取真实会话。
   字段语义对齐 magpie Route / Prompt / usage.Record：
   - usage.in 不含 cacheRead / cacheWrite；提示总量 = 三者之和
   - prompt.tokens 为上游校准后的总量，六类按估计比例分配
   - ttft = 到第一个内容；firstText = 到第一个文本（工具调用不算文本）
   - 一笔请求 = 客户端的一次调用；工具往返各算一笔
   ================================================================== */

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n = (v) => v == null ? '—' : v.toLocaleString('en-US');
const kk = (v) => v == null ? '—' : v >= 1000000 ? (v/1e6).toFixed(1)+'M' : v >= 1000 ? (v/1000).toFixed(1)+'k' : String(v);
const secs = (ms) => ms == null ? '—' : (ms/1000).toFixed(2)+' s';

const TOOLS = [
  {type:'function', function:{name:'read_file', description:'读取项目中的文本文件。', parameters:{type:'object', properties:{path:{type:'string'}}, required:['path']}}},
  {type:'function', function:{name:'run_check', description:'运行已存在的项目检查。', parameters:{type:'object', properties:{target:{type:'string'}}, required:['target']}}},
];

const SYS = {role:'system', content:'你是项目开发助手。先理解代码，再修改。保留已有接口，完成后说明验证结果。'};
const BRIEF = {role:'user', ctx:true, content:'项目说明（演示）\n工作目录：/demo/workspace\n请使用中文回复。修改前先查看相关实现和现有检查。'};

const FILE_SHORT = [
  "import { visibleRequests } from './filter';",
  '',
  'export function RequestList({ requests, filters }) {',
  '  const filtered = visibleRequests(requests, filters);',
  '  if (requests.length === 0) return <Empty text="暂无请求" />;',
  '  return <ul>{filtered.map(r => <Row key={r.id} request={r} />)}</ul>;',
  '}',
].join('\n');

const FILE_LONG = Array.from({length:64}, (_, i) => {
  const lines = [
    "import { visibleRequests } from './filter';",
    "import { Row } from './row';",
    '',
    'export function RequestList({ requests, filters }) {',
    '  const filtered = visibleRequests(requests, filters);',
    '  if (requests.length === 0) return <Empty text="暂无请求" />;',
    '  return <ul className="request-list">',
    '    {filtered.map(r => <Row key={r.id} request={r} />)}',
    '  </ul>;',
    '}',
    '',
    '// 演示文件：保留筛选后的空集合语义。',
    'function Empty({ text }) {',
    '  return <p className="request-empty">{text}</p>;',
    '}',
  ];
  return `${String(i+1).padStart(3,' ')}  ${lines[i % lines.length]}`;
}).join('\n');

const M = {
  sys: SYS,
  brief: BRIEF,
  u1: {role:'user', content:'先看一下请求列表组件怎么渲染空状态。'},
  a1: {role:'assistant', content:'RequestList 在 src/request-list.tsx 里渲染。目前只有一个空状态分支：requests.length === 0 时显示「暂无请求」。筛选后为空同样会走到这里，所以会把「筛选无结果」也提示成「暂无请求」。'},
  u2: {role:'user', content:'筛选后没有结果时应该提示什么？'},
  c2: {role:'assistant', content:null, tool_calls:[{id:'call_01', type:'function', function:{name:'read_file', arguments:'{"path":"src/request-list.tsx"}'}}]},
  t2: {role:'tool', tool_call_id:'call_01', content:FILE_SHORT},
  a2: {role:'assistant', content:'筛选后的集合由 visibleRequests(requests, filters) 产生。它返回空数组时，RequestList 拿到的仍是空列表，无法和「本来就没有请求」区分。建议分别渲染两种空状态。'},
  u3: {role:'user', content:'阅读组件说明，整理需要修改的范围。'},
  a3: {role:'assistant', content:'需要修改的范围有三处：\n1. 列表为空时的占位内容。\n2. 筛选无结果时的提示。\n3. '},
  u4: {role:'user', content:'把改动范围写清楚一点，并给出验证方式。'},
  u5: {role:'user', content:'还是先读请求列表组件，确认空状态放在哪一层。'},
  c5: {role:'assistant', content:null, tool_calls:[{id:'call_02', type:'function', function:{name:'read_file', arguments:'{"path":"src/request-list.tsx"}'}}]},
  t5: {role:'tool', tool_call_id:'call_02', content:FILE_LONG},
  a5: {role:'assistant', content:'空状态放在列表渲染层即可。visibleRequests 已经返回筛选后的数组，RequestList 可以直接按 filtered.length 分支；筛选条件仍由父组件传入，不需要改函数签名。'},
  u6: {role:'user', content:'为请求列表补上空状态，保留现有筛选行为。'},
  c6: {role:'assistant', content:null, tool_calls:[{id:'call_03', type:'function', function:{name:'read_file', arguments:'{"path":"src/request-list.tsx"}'}}]},
  t6: {role:'tool', tool_call_id:'call_03', content:FILE_SHORT},
  c6b: {role:'assistant', content:null, tool_calls:[{id:'call_04', type:'function', function:{name:'run_check', arguments:'{"target":"request-list"}'}}]},
  t6b: {role:'tool', tool_call_id:'call_04', content:'PASS request-list\n3 checks passed: no requests, filtered empty, visible rows.'},
  a6: {role:'assistant', content:'已补上两种空状态：\n\n• 尚无请求时，提示等待第一笔请求。\n• 筛选结果为空时，提示调整筛选条件。\n\n现有筛选逻辑保持不变，列表检查 3 项通过。'},
  u7: {role:'user', content:'把刚才的改动整理成提交说明，并列出验证结果。'},
};

/* 回复是给模型看的协议文本，不是网页源码。先整体转义，再识别少量结构；
   不支持的语法原样保留，绝不把消息内容当 HTML 执行。 */
function mdToHtml(text) {
  const src = String(text ?? '');
  const blocks = [];
  const keep = (html) => `\u0000${blocks.push(html) - 1}\u0000`;
  let body = src.replace(/```([\w-]*)\n([\s\S]*?)```/g, (_, lang, code) =>
    keep(`<pre class="md-code" tabindex="0">${esc(code.replace(/\n$/, ''))}</pre>`));

  const lines = body.split('\n');
  const out = [];
  let i = 0;
  const isTableSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(l);
  const cells = (l) => l.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { out.push(''); i++; continue; }
    if (/^```/.test(line)) { out.push(''); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(line) && isTableSep(lines[i + 1] || '')) {
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
      out.push(`<div class="md-table-wrap"><table class="md-table"><thead><tr>${
        head.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${
        rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')
      }</tbody></table></div>`);
      continue;
    }
    if (/^\s*[-*•]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) {
        items.push(`<li>${inline(lines[i].replace(/^\s*[-*•]\s+/, ''))}</li>`); i++;
      }
      out.push(`<ul class="md-list">${items.join('')}</ul>`);
      continue;
    }
    if (/^\s*\d+[.)]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) {
        items.push(`<li>${inline(lines[i].replace(/^\s*\d+[.)]\s+/, ''))}</li>`); i++;
      }
      out.push(`<ol class="md-list">${items.join('')}</ol>`);
      continue;
    }
    if (/^#{1,4}\s+/.test(line)) {
      out.push(`<p class="md-head">${inline(line.replace(/^#{1,4}\s+/, ''))}</p>`); i++;
      continue;
    }
    out.push(`<p>${inline(line)}</p>`);
    i++;
  }
  return out.join('\n').replace(/\u0000(\d+)\u0000/g, (_, k) => blocks[Number(k)]);

  function inline(t) {
    return esc(t)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }
}

/* ---------------- 派生视图 ---------------- */
function replyOf(r) {
  if (r.replyMsg) return r.replyMsg;
  if (r.reply) return {role:'assistant', content:r.reply};
  return null;
}
function replyText(r) { return replyOf(r)?.content || ''; }
function replyCalls(r) { return replyOf(r)?.tool_calls || []; }
function replyLabel(r) {
  const calls = replyCalls(r);
  if (calls.length) return `${calls[0].function.name}(${calls[0].function.arguments})`;
  const t = replyText(r);
  return t ? t.replace(/\s+/g, ' ').slice(0, 90) : '';
}

function scalarItems(req) {
  const keys = Object.keys(req).filter(k => k !== 'messages' && k !== 'tools');
  if (!keys.length) return [];
  return [{
    path: keys.join(' · '), kind: 'PARAM',
    text: keys.map(k => `${k}=${typeof req[k] === 'string' ? req[k] : JSON.stringify(req[k])}`).join('  '),
    full: JSON.stringify(Object.fromEntries(keys.map(k => [k, req[k]])), null, 2),
  }];
}

function items(r) {
  if (!r.request) return [];
  const out = scalarItems(r.request);
  for (const [key, value] of Object.entries(r.request)) {
    if (key === 'messages') {
      value.forEach((m, i) => {
        const call = m.tool_calls && m.tool_calls[0];
        const kind = call ? 'CALL'
          : m.role === 'system' ? 'SYSTEM'
          : m.role === 'user' ? 'USER'
          : m.role === 'tool' ? 'TOOL'
          : 'ASSISTANT';
        const text = call ? `${call.function.name}(${call.function.arguments})` : String(m.content ?? '');
        out.push({path:`messages[${i}]`, kind, text: text.replace(/\s+/g, ' '), full:text});
      });
    } else if (key === 'tools') {
      value.forEach((t, i) => out.push({
        path:`tools[${i}]`, kind:'SCHEMA', text:t.function.name, full:JSON.stringify(t, null, 2),
      }));
    }
  }
  const reply = replyOf(r);
  out.push({
    path:'$response', kind:'REPLY',
    text: reply ? replyLabel(r) || '（空回复）' : '没有收到回复',
    full: reply ? (reply.content || replyLabel(r)) : '',
  });
  return out;
}

const hashMsg = (m) => JSON.stringify(m);
function previousOf(req) {
  const g = SESSIONS.find(s => s.requests.includes(req.id));
  if (!g) return null;
  const i = g.requests.indexOf(req.id);
  return i > 0 ? REQUESTS[g.requests[i-1]] : null;
}
function newSet(req) {
  const prev = previousOf(req);
  if (!prev || !prev.request || !req.request) return null;
  const old = new Set((prev.request.messages || []).map(hashMsg));
  return new Set((req.request.messages || []).map((m, i) => old.has(hashMsg(m)) ? null : i).filter(i => i !== null));
}

function requestsOf(key) { const s = SESSIONS.find(x => x.key === key); return s ? s.requests.map(id => REQUESTS[id]) : []; }
function currentSession() { return SESSIONS.find(s => s.key === state.session) || SESSIONS[0]; }
function currentReq() { return REQUESTS[state.reqId] || null; }
function ensureSelection() {
  const rows = requestsOf(state.session);
  if (!rows.some(r => r.id === state.reqId)) {
    state.reqId = rows.at(-1)?.id || null;
    state.open = new Set(state.reqId ? [state.reqId] : []);
    state.selected = null;
    state.deltaOnly = false;

}

/* ---------------- 顶栏与左栏 ---------------- */
function renderCrumb() {

function renderFilters() {

}

function sessionMatches(s) {
  if (state.agent !== 'all' && s.agent !== state.agent) return false;
  if (!state.query) return true;
  const q = state.query.toLowerCase();
  const rows = s.requests.map(id => REQUESTS[id]);
  return [s.title, s.agent, s.session || '', ...rows.flatMap(r => [r.id, r.title])]
    .join(' ').toLowerCase().includes(q);
}

function sessFlag(rows) {
  if (rows.some(r => r.status === 'failed')) return { color:'var(--bad)', text:'含失败' };
  if (rows.some(r => r.status === 'incomplete')) return { color:'var(--warn)', text:'含未完成' };
  if (rows.some(r => r.status === 'unknown')) return { color:'var(--warn)', text:'待确认' };
  if (rows.some(r => !r.request)) return { color:'var(--muted)', text:'缺正文' };
  return { color:'var(--line-strong)', text:'' };
}

function renderSessions() {
  const list = SESSIONS.filter(sessionMatches);
  const assigned = list.filter(s => s.session);
  const loose = list.filter(s => !s.session);
  document.getElementById('sess-count').textContent = `${list.length} 项`;
  const item = (s) => {
    const rows = s.requests.map(id => REQUESTS[id]);
    const flag = sessFlag(rows);
    return `<button class="sess" data-session="${esc(s.key)}" aria-current="${s.key === state.session}">
      <span class="sess-title">${esc(s.title)}</span>
      <span class="sess-time num">${esc(rows.at(-1)?.at || '')}</span>
      <span class="sess-meta">
        <span class="dot" style="background:${flag.color}"></span>
        <span class="who">${esc(s.agent)}</span><span class="sep">·</span>
        <span>${rows.length} 笔</span>
        ${flag.text ? `<span class="sep">·</span><span style="color:${flag.color}">${flag.text}</span>` : ''}
      </span>
    </button>`;
  };
  document.getElementById('sessions-list').innerHTML =
    (assigned.length ? `<div class="group-label">已归属会话</div>` + assigned.map(item).join('') : '') +
    (loose.length ? `<div class="group-label">未归属请求</div>` + loose.map(item).join('') : '') +
    (!list.length ? '<p class="sess-empty">没有符合筛选的会话。</p>' : '');
}

/* ---------------- 中栏：会话头 ---------------- */
function statusChip(r) {
  const map = {success:['ok','完成'], failed:['bad','失败'], incomplete:['warn','回复未完成'], unknown:['mute','状态待确认']};
  const [cls, text] = map[r.status] || map.unknown;
  return `<span class="state-chip ${cls}"><span class="d"></span>${text}</span>`;
}
function viaText(r) {
  return {through:'经过网关', direct:'direct · 来自账本', reported:'reported · 客户端上报', hook:'仅正文回调'}[r.via] || r.via;
}

function sessionHead() {
  const s = currentSession();
  const rows = requestsOf(state.session);
  const latest = rows.at(-1);
  const totalIn = rows.reduce((a, r) => a + (r.usage?.in || 0) + (r.usage?.cacheRead || 0) + (r.usage?.cacheWrite || 0), 0);
  const totalOut = rows.reduce((a, r) => a + (r.usage?.out || 0), 0);
  const totalCost = rows.reduce((a, r) => a + (parseFloat(r.usage?.cost) || 0), 0);

  return `<header class="session-head">
    <div class="eyebrow">${s.session ? 'Session' : 'Unassigned'}</div>

      <span>${esc(rows[0]?.at)}–${esc(latest?.at)}</span>
      ${hasUsage ? `<span class="sum">已记录请求相加：${kk(totalIn)} 提示 · ${kk(totalOut)} 输出 · $${totalCost.toFixed(4)}</span>` : '<span class="sum muted">这批记录没有报告的用量，合计为空</span>'}
    </div>
    <div class="view-row">
      <div class="seg" role="group" aria-label="会话视图">

    </div>
    ${!s.session ? `<div class="session-note warn"><span>↳</span><span>这些请求没有可确认的会话归属。会话字段为空不等于没有会话，也不与其它请求合并。</span></div>` : ''}
    ${latest && !latest.request ? `<div class="session-note warn"><span>↳</span><span>最新一笔（${esc(latest.id)}）缺正文。保留身份与读数，不用更早的请求替代。</span></div>` : ''}
    ${rows.some(r => r.status === 'unknown') ? `<div class="session-note"><span>↳</span><span>有请求尚未与账本对齐。正文与元数据分开保存，关联状态单独显示。</span></div>` : ''}
  </header>`;

/* ---------------- 对话视图 ---------------- */
function convNote(rows) {
  const first = rows[0];
  const start = first?.request?.messages?.filter(m => m.role === 'system' || m.ctx) || [];
  if (!start.length) return '';
  const names = start.map(m => m.role === 'system' ? '系统提示' : '项目说明');
  return `<div class="conv-note"><span>◆</span><span>会话起点：${names.join(' + ')}（第一笔请求的新增内容）。之后每一笔都会随全上下文重发，因此不在对话里重复展示。</span></div>`;
}

function convUserBlock(m, reqId) {
  return `<div class="conv-user" data-select="${esc(reqId)}" title="选中这笔请求，右侧显示读数">
    <div class="conv-who">USER</div>
    <div class="conv-user-body">${esc(m.content)}</div>
  </div>`;
}

function convStrip(r) {
  const t = r.timing || {};
  const u = r.usage || {};
  const speed = (t.flow && u.out) ? Math.round(u.out / (t.flow / 1000)) : null;
  const parts = [
    t.ttft != null ? `首字 <b>${(t.ttft/1000).toFixed(2)}s</b>` : null,
    t.ms != null ? `时长 <b>${(t.ms/1000).toFixed(2)}s</b>` : null,
    u.in != null ? `↓ <b>${n(u.in)}</b>` : null,
    u.cacheRead ? `⛁ <b>${n(u.cacheRead)}</b>` : null,
    u.out != null ? `↑ <b>${n(u.out)}</b>` : null,
    speed ? `<b>${speed}</b> tok/s` : null,
    u.cost ? `$${u.cost}` : null,
    r.attempts && r.attempts.length > 1 ? `<b>${r.attempts.length}</b> 次尝试` : null,
  ].filter(Boolean);
  return `<div class="conv-strip">${parts.map(p => `<span>${p}</span>`).join('<span class="sep">·</span>')}</div>`;
}

function convToolCard(r, results) {
  const calls = replyCalls(r);
  const chips = calls.map(c => {
    const res = results.get(c.id);
    return `<span class="tool-chip call" title="本响应发出的工具调用"><span>${esc(c.function.name)}(${esc(c.function.arguments)})</span></span>
      ${res != null
        ? `<span class="tool-chip res"><span>结果已记录 · ${res.split('\n').length} 行</span></span>`
        : `<span class="tool-chip miss"><span>结果未出现在后续请求中</span></span>`}`;
  }).join('');
  const res = calls.length ? results.get(calls[0].id) : null;
  return `<div class="conv-asst-card" data-select="${esc(r.id)}" title="选中这笔请求，右侧显示读数">
    <div class="conv-asst-head">
      <span class="conv-who">ASSISTANT</span>
      <span class="mono muted" style="font-size:10px">${esc(r.replyState?.model || '模型名未报告')}</span>
      <span class="grow"></span>
      <span class="mono muted" style="font-size:10px">finish: ${esc(r.replyState?.finish)}</span>
    </div>
    <div class="conv-tools"><span class="label">发出调用</span>${chips}</div>
    ${res != null ? `<details><summary>查看工具结果</summary><pre class="raw" tabindex="0">${esc(res)}</pre></details>` : ''}
    ${convStrip(r)}
  </div>`;
}

function convReplyCard(r) {
  if (r.status === 'failed' || !replyOf(r)) {
    return `<div class="conv-asst-card" data-select="${esc(r.id)}" title="选中这笔请求，右侧显示读数">
      <div class="conv-asst-head">
        <span class="conv-who">ASSISTANT</span><span class="grow"></span>
        <span class="state-chip bad"><span class="d"></span>没有收到回复</span>
      </div>
      <div class="conv-fail"><span>✕</span><span>最近一次尝试返回 ${r.attempts?.at(-1)?.status ?? '未知状态'}。失败尝试的用量仍保留在账本里，不并入成功请求。这一轮没有 assistant 内容可读。</span></div>
    </div>`;
  }
  return `<div class="conv-asst-card" data-select="${esc(r.id)}" title="选中这笔请求，右侧显示读数">
    <div class="conv-asst-head">
      <span class="conv-who">ASSISTANT</span>
      <span class="mono muted" style="font-size:10px">${esc(r.replyState?.model || '模型名未报告')}</span>
      <span class="grow"></span>
      <span class="mono" style="font-size:10px;${r.replyState?.finish === 'length' ? 'color:var(--warn)' : 'color:var(--muted)'}">finish: ${esc(r.replyState?.finish)}</span>
    </div>
    <div class="conv-asst-body">${mdToHtml(replyText(r))}</div>

function convMissing(r) {
  return `<div class="conv-asst-card" data-select="${esc(r.id)}" title="选中这笔请求，右侧显示读数">
    <div class="conv-asst-head">

function renderConversation() {
  const rows = requestsOf(state.session);
  const results = new Map();
  for (const r of rows) for (const m of (r.newMsgs || [])) if (m.role === 'tool') results.set(m.tool_call_id, m.content);

  rows.forEach((r, i) => {

    const card = !r.request ? convMissing(r) : replyCalls(r).length ? convToolCard(r, results) : convReplyCard(r);
    html += `<section class="conv-req" data-req="${esc(r.id)}" data-current="${r.id === state.reqId}" aria-current="${r.id === state.reqId}">
      <div class="conv-gutter"><b>${String(i+1).padStart(2,'0')}</b><em>${esc(r.at)}</em></div>

          ? '这一笔没有新的用户消息，输入是上一笔的工具结果。'

  return html + '</div>';

/* ---------------- 账本视图 ---------------- */
function ledgerRow(r, idx) {
  const open = state.open.has(r.id);
  const flag =
    r.status === 'failed' ? '<span class="req-flag bad">失败</span>' :
    r.status === 'incomplete' ? '<span class="req-flag warn">未完成</span>' :
    !r.request ? '<span class="req-flag mute">无正文</span>' :
    r.ledger && !r.ledger.found ? '<span class="req-flag warn">待关联</span>' : '';
  return `<article class="req" data-req="${esc(r.id)}" data-status="${r.status}" data-open="${open}" aria-current="${r.id === state.reqId}">
    <button class="req-head" data-toggle="${esc(r.id)}" aria-expanded="${open}">
      <span class="req-node" aria-hidden="true"></span>

      </span>
      <span class="req-metrics">
        ${r.timing?.ms != null ? `<span class="num">${secs(r.timing.ms)}</span>` : ''}
        <span class="num opt">${r.usage?.in != null ? '↓' + kk(r.usage.in + (r.usage.cacheRead || 0) + (r.usage.cacheWrite || 0)) : '↓ 未报告'}</span>
        ${r.usage?.out != null ? `<span class="num opt">↑ ${kk(r.usage.out)}</span>` : ''}
        ${r.attempts && r.attempts.length > 1 ? `<span class="opt">${r.attempts.length} 次尝试</span>` : ''}
        <span class="req-open-mark" aria-hidden="true"><svg width="9" height="9" viewBox="0 0 10 10" fill="none"><path d="M3 1.5L7 5l-4 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </span>
    </button>
    ${open ? requestBody(r, idx) : ''}
  </article>`;
}

function messageIndex(it) {
  const m = /^messages\[(\d+)\]$/.exec(it.path);
  return m ? Number(m[1]) : null;
}

function requestBody(r, idx) {
  const rows = r.request ? items(r) : [];
  const fresh = newSet(r);
  const freshCount = fresh ? fresh.size : 0;
  const deltaOn = !!fresh && state.deltaOnly.has(r.id);
  const itemQuery = state.searches[r.id] || '';
  const shown = deltaOn ? rows.filter(it => it.kind === 'REPLY' || fresh.has(messageIndex(it))) : rows;
  const meta = [
    `<span class="id">${esc(r.id)}</span>`,
    `<span class="muted">${viaText(r)}</span>`,
    `<span class="muted">${esc(r.agent)}</span>`,
    r.attempts ? `<span class="muted">${r.attempts.length} 次尝试</span>` : '',
  ].filter(Boolean).join('');

  return `<div class="req-body">
    <div class="body-top">
      <span class="num muted" style="font-size:10.5px">Request ${String(idx + 1).padStart(2,'0')}</span>
      ${statusChip(r)}
      ${meta}
      <span class="grow"></span>
      ${r.caveat ? `<span class="req-flag warn" title="${esc(r.caveat)}">注意边界</span>` : ''}
    </div>
    ${r.request ? `
      <section class="section">
        <div class="section-head">
          <h3>请求结构</h3>
          <span class="count">${deltaOn ? `${shown.length - 1} / ${rows.length - 1}` : rows.length - 1} 项 + 回复</span>
          ${fresh ? `<span class="count" style="color:var(--accent)">新增消息 ${freshCount}</span>` : ''}
          <span class="grow"></span>
          ${r.request.messages && previousOf(r)?.request ? `<div class="seg" role="group" aria-label="结构范围">
            <button data-delta="${esc(r.id)}" data-scope="all" aria-pressed="${!deltaOn}">全部</button>
            <button data-delta="${esc(r.id)}" data-scope="new" aria-pressed="${deltaOn}">仅本轮新增</button>
          </div>` : ''}
          <input class="mini-search" data-item-search="${esc(r.id)}" type="search" placeholder="查找协议内容" value="${esc(itemQuery)}" aria-label="查找协议内容">
        </div>
        <div class="path-table">
          <div class="path-head"><span>#</span><span>路径</span><span>类型</span><span>内容</span><span></span></div>
          <div class="path-scroll">
            ${shown.map((it) => {
              const mi = messageIndex(it);
              const isNew = fresh ? (mi != null && fresh.has(mi)) : false;
              const sel = state.selected && state.selected.req === r.id && state.selected.path === it.path;
              return `<button class="path-row" data-item="${esc(it.path)}" data-owner="${esc(r.id)}" aria-current="${sel}" data-new="${isNew}" data-dim="${fresh && !deltaOn && !isNew && it.kind !== 'REPLY'}">
                <span class="path-idx">${String(rows.indexOf(it) + 1).padStart(2,'0')}</span>
                <span class="path-name">${esc(it.path)}</span>
                <span class="kind ${it.kind}">${it.kind}</span>
                <span class="path-preview" title="${esc(it.path)}">${esc(it.text || '（空内容）')}</span>
                <span class="path-flag">${isNew ? '新增' : ''}</span>
              </button>`;
            }).join('') || '<p class="sess-empty">当前筛选下没有内容。</p>'}
          </div>
        </div>
        ${fresh ? `<div class="delta-note"><b>本轮新增</b><span>按消息内容哈希与本会话上一笔请求比较，是派生视图。请求本身仍是全上下文重发；压缩或裁剪后，比较结果可能把旧内容也标成新增。</span></div>` : ''}
      </section>
      <section class="section">
        <div class="section-head"><h3>本次回复</h3><span class="count">合并后的回复，与请求上下文分开</span></div>
        ${replyBlock(r)}
      </section>` : `
      <section class="section">
        <div class="section-head"><h3>正文</h3></div>
        <div class="reply-card"><div class="reply-empty">
          <b>这笔记录没有正文</b>
          <span>${esc(r.caveat || (r.via === 'direct' ? 'direct 行没有正文与路由决策。' : '网关已入账，正文回调没有收到。'))}</span>
        </div></div>
      </section>`}
    <div class="disclosures">
      <details><summary>路由与尝试 · ${r.attempts ? `${r.attempts.length} 次尝试` : '不可用或待关联'}</summary><div class="d-body">${routeBlock(r)}</div></details>
      <details><summary>协议对象与阅读边界</summary><div class="d-body">${rawBlock(r)}</div></details>
    </div>
  </div>`;
}

function replyBlock(r) {
  if (!r.request) return '';
  const st = r.replyState || {};
  const calls = replyCalls(r);
  if (calls.length) {
    return `<div class="reply-card">
      <div class="reply-head">
        <span class="who">ASSISTANT</span>
        <span class="mono muted" style="font-size:10px">${esc(st.model || '模型名未报告')}</span>
        <span class="grow"></span>
        <span class="mono muted" style="font-size:10px">finish: ${esc(st.finish)}</span>
      </div>
      <div class="conv-tools"><span class="label">本响应发出的调用</span>
        ${calls.map(c => `<span class="tool-chip call"><span>${esc(c.function.name)}(${esc(c.function.arguments)})</span></span>`).join('')}
      </div>
      <p class="note" style="padding:0 12px 10px">工具结果不在本次回复里。它出现在下一笔请求的 messages 中，按 tool_call_id 对应。</p>
    </div>`;
  }
  if (!replyOf(r)) {
    return `<div class="reply-card">
      <div class="reply-head"><span class="who">ASSISTANT</span><span class="grow"></span>
        <span class="state-chip bad"><span class="d"></span>没有收到回复</span></div>
      <div class="reply-empty"><b>本次请求失败，回复为 null</b>
        <span>最近一次尝试返回 ${r.attempts?.at(-1)?.status ?? '未知状态'}。失败尝试的用量仍保留在账本里，不并入成功请求。</span></div>
    </div>`;
  }
  const t = replyText(r);
  const clipped = t.length > 520 && !state.replyOpen;
  return `<div class="reply-card">
    <div class="reply-head">
      <span class="who">ASSISTANT</span>
      <span class="mono muted" style="font-size:10px">${esc(st.model || '模型名未报告')}</span>
      <span class="grow"></span>
      <span class="mono muted" style="font-size:10px">finish: ${esc(st.finish || '未报告')}</span>
      ${st.streamed ? '<span class="mono muted" style="font-size:10px">streamed</span>' : ''}
    </div>
    <div class="reply-text ${clipped ? 'clip' : ''}">${mdToHtml(t)}</div>
    ${clipped || state.replyOpen ? `<div class="reply-actions"><button class="chip-btn" data-reply-toggle="1">${state.replyOpen ? '收起' : '展开全文'}</button></div>` : ''}
  </div>`;
}

function routeBlock(r) {
  if (!r.route) {
    return `<p class="note">${r.via === 'hook'
      ? '回调里没有 route_id。本演示保留两个候选，不按相近时间强行确定；路由结论保持未知。'
      : '当前来源没有网关路由。direct / reported 只说明这笔调用被记录，不说明它经过 magpie 路由器。'}</p>
      ${r.candidates ? `<pre class="raw">${esc(r.candidates.join('\n'))}\n\n关联状态：歧义，待核验</pre>` : ''}`;
  }
  const rt = r.route;
  const sentName = rt.order.at(-1)?.split('/')[1];
  const servedDiff = rt.served && sentName && rt.served !== sentName;
  return `<dl class="chain">
    <div class="chain-row"><dt>客户端请求</dt><dd><code>${esc(rt.requested)}</code></dd></div>
    <div class="chain-row"><dt>命中规则</dt><dd><code>${esc(rt.rule)}</code>${rt.held ? '<span class="muted"> · 回合开始时已定，回合内沿用</span>' : '<span class="muted"> · 回合内重新匹配</span>'}</dd></div>
    ${rt.classified ? `<div class="chain-row"><dt>意图分类</dt><dd><code>${esc(rt.classified.model)}</code> → <code>${esc(rt.classified.intent)}</code> · score ${rt.classified.score} · ${rt.classified.sure ? 'sure' : '不确定'} · ${rt.classified.cached ? '命中缓存' : '未命中缓存'} · ${rt.classified.ms} ms<span class="muted">（决策证据，不是路由正确率）</span></dd></div>` : ''}
    <div class="chain-row"><dt>亲和性</dt><dd><code>why=${esc(rt.affinity)}</code><span class="muted">${rt.kept ? ' · 上次应答者被排到最前' : ' · 没有沿用上次应答者'}</span>${rt.affinity === 'cache' ? '<span class="muted"> · 发送前保留缓存位置的决策，不代表本次已命中缓存</span>' : ''}</dd></div>
    <div class="chain-row"><dt>候选顺序</dt><dd class="mono" style="font-size:10px">${rt.order.map(esc).join(' → ')}</dd></div>
    <div class="chain-row"><dt>上游返回模型</dt><dd>${rt.served ? `<code>${esc(rt.served)}</code>${servedDiff ? ' <span class="req-flag warn">与发送名称不同</span>' : ''}` : '<span class="muted">未报告</span>'}</dd></div>
  </dl>
  ${r.attempts ? `<div style="margin-top:10px">
    <div class="attempt-bar" aria-hidden="true">${r.attempts.map(a => `<i class="${a.status === 200 ? 'ok' : 'bad'}" style="flex:${Math.max(a.ms, 40)}"></i>`).join('')}</div>
    ${r.attempts.map((a, i) => `<div class="attempt">
      <span class="attempt-n">${i + 1}</span>
      <span><span class="attempt-name">${esc(a.provider)} / ${esc(a.model)}</span>
        ${a.fail ? `<div class="attempt-note">${esc(a.fail)}</div>` : ''}
        ${a.net ? `<div class="breakdown"><span>网关 <b>${a.net.own} ms</b></span><span>网络 <b>${(a.net.dns||0)+(a.net.connect||0)+(a.net.tls||0)+(a.net.send||0)} ms</b></span><span>上游首字节 <b>${a.net.wait} ms</b></span></div>` : ''}
      </span>
      <span class="attempt-side">${secs(a.ms)}<span class="sc ${a.status === 200 ? 'ok' : 'bad'}">HTTP ${a.status}</span></span>
    </div>`).join('')}
  </div>` : ''}
  <p class="note" style="margin-top:8px">只显示已记录的决策与尝试。窗口过滤不保证完整留痕，无法为所有未选模型提供原因；用量条目数量也不等于尝试次数。</p>
  ${r.caveat ? `<p class="note warn" style="margin-top:6px">${esc(r.caveat)}</p>` : ''}`;
}

function rawBlock(r) {
  const reply = replyOf(r);
  const blocks = [
    ['客户端请求对象', r.request ? JSON.stringify(r.request, null, 2) : null],
    ['合并回复', reply ? JSON.stringify({id:`demo-response-${r.id}`,
      status: r.replyState?.finish === 'length' ? 'incomplete' : r.replyState?.finish === 'error' ? 'failed' : 'completed',
      model: r.replyState?.model, choices:[{message: reply}]}, null, 2) : null],
  ];
  return blocks.map(([name, obj]) => obj
    ? `<div style="margin-bottom:10px"><div class="label" style="margin-bottom:4px">${name}</div><pre class="raw" tabindex="0">${esc(obj)}</pre></div>`
    : `<div style="margin-bottom:10px"><div class="label" style="margin-bottom:4px">${name}</div><p class="note">当前来源或关联状态没有提供此对象。</p></div>`
  ).join('') + `<p class="note">这里保存的是客户端提交的协议对象，经过脱敏。hook 观察点在后续 middleware、协议转换与逐 provider 改写之前，不代表每个最终模型收到的逐字节输入。最新请求可能包含重发的历史，也可能被压缩或裁剪，不保证是完整会话。</p>`;
}

function renderMain() {
  ensureSelection();
  const rows = requestsOf(state.session);
  const main = document.getElementById('main');
  const keep = main.scrollTop;
  main.innerHTML = sessionHead() + (state.view === 'ledger'
    ? `<div class="ledger">${rows.map((r, i) => ledgerRow(r, i)).join('') || '<p class="sess-empty">这个会话没有已记录的请求。</p>'}</div>`
    : renderConversation());
  main.scrollTop = keep;
  applyAllItemSearches();
}

/* ---------------- 右栏 ---------------- */
function bigNumbers(r) {
  const t = r.timing || {};
  const speed = (t.flow && r.usage?.out) ? r.usage.out / (t.flow / 1000) : null;
  const cells = [
    ['首字', t.ttft != null ? (t.ttft / 1000).toFixed(2) : '—', t.ttft != null ? 's' : '', 'TTFT：到第一个内容（文本、推理或工具调用）'],
    ['时长', t.ms != null ? (t.ms / 1000).toFixed(2) : '—', t.ms != null ? 's' : '', '从请求到回复结束'],
    ['输出速度', speed ? Math.round(speed) : '—', speed ? 'tok/s' : '', '输出 token ÷ 生成耗时（不含首字等待）'],
  ];
  return `<div class="rail-big">${cells.map(([k, v, u, title]) => `<div title="${esc(title)}">
    <div class="k">${k}</div><div class="v">${v}${u ? `<small>${u}</small>` : ''}</div></div>`).join('')}</div>`;
}

function railHead() {
  const r = currentReq();
  if (!r) return '<div class="rail-id">未选择请求</div>';
  const s = currentSession();
  const idx = s.requests.indexOf(r.id) + 1;
  return `<div class="rail-id"><span>Request ${String(idx).padStart(2,'0')}</span><span class="muted">·</span><span>${esc(r.at)}</span><span class="grow"></span>${statusChip(r)}</div>
    <div class="rail-title">${esc(r.title)}</div>
    ${bigNumbers(r)}
    <div class="rail-tabs" role="tablist">
      <button role="tab" data-rail="facts" aria-pressed="${state.railTab === 'facts'}">读数</button>
      <button role="tab" data-rail="body" aria-pressed="${state.railTab === 'body'}">正文</button>
    </div>`;
}

function timingSection(r) {
  const t = r.timing || {};
  if (t.ms == null) {
    return `<section class="rail-section"><h3>时间构成</h3>
      <p class="rail-note">${r.via === 'through' ? '上游没有报告本笔耗时，或正文回调缺失，首字时间不可得。' : '当前来源不提供网关计时。'}</p></section>`;
  }
  const ttft = t.ttft;
  const ms = t.ms;
  const ft = t.firstText;
  const waitPct = ttft != null ? Math.min(100, ttft / ms * 100) : 100;
  const tickPct = ft != null && ms ? Math.min(100, ft / ms * 100) : null;
  const speed = (t.flow && r.usage?.out) ? Math.round(r.usage.out / (t.flow / 1000)) : null;
  const rows = [
    ttft != null
      ? `<span class="k"><i class="sw" style="background:var(--line-strong)"></i>首字前（排队 + 网络 + 首 token）</span><span class="v">${secs(ttft)}</span>`
      : `<span class="k"><i class="sw" style="background:var(--line-strong)"></i>首字前</span><span class="v">未报告</span>`,
    ttft != null
      ? `<span class="k"><i class="sw" style="background:var(--accent);opacity:.62"></i>首字后生成</span><span class="v">${secs(ms - ttft)}</span>`
      : '',
    `<span class="k"><i class="sw" style="background:var(--text);width:2px;height:9px;border-radius:1px"></i>首个文本</span><span class="v">${ft != null ? secs(ft) : replyOf(r) ? '无文本（工具调用或非流式）' : '没有收到'}</span>`,
    speed ? `<span class="k">输出速度</span><span class="v">${speed} tok/s</span>` : '',
  ].filter(Boolean).join('');
  const modeHint = r.status === 'failed' ? '失败' : !replyOf(r) ? '无正文' : r.replyState?.streamed ? 'streamed' : '非流式';
  return `<section class="rail-section">
    <h3>时间构成<span class="grow"></span><span class="hint">${modeHint}</span></h3>
    <div class="time-wrap">
      <div class="time-bar" aria-hidden="true">
        <i class="wait" style="width:${waitPct}%"></i><i class="gen" style="width:${100 - waitPct}%"></i>
        ${tickPct != null ? `<span class="time-tick" style="left:${tickPct}%"></span>` : ''}
      </div>
      <div class="time-legend">${rows}</div>
    </div>
    <p class="rail-note">${r.status === 'failed'
      ? '这笔请求最终失败，只有总耗时；首字与生成速度不可得。'
      : !replyOf(r)
        ? '正文回调缺失，总耗时来自账本；首字与生成速度在这条通道上不可得。'
        : '首字是到第一个内容（文本、推理或工具调用）；首个文本通常更晚，工具调用请求可以没有文本。生成耗时为总时长减去首字，速度只在两者都可得出时计算。'}</p>
  </section>`;
}

function usageSection(r) {
  const u = r.usage || {};
  const total = (u.in || 0) + (u.cacheRead || 0) + (u.cacheWrite || 0);
  const cell = (label, val) => `<div class="u-cell"><div class="k">${label}</div>${val == null
    ? '<div class="v miss">未报告</div>'
    : `<div class="v">${n(val)}</div>`}</div>`;
  const hit = u.cacheRead != null && total ? Math.round(u.cacheRead / total * 100) : null;
  return `<section class="rail-section">
    <h3>用量<span class="grow"></span><span class="hint">上游报告</span></h3>
    <div class="u-grid">
      ${cell('输入（不含缓存）', u.in)}
      ${cell('输出', u.out)}
      ${cell('缓存读取', u.cacheRead)}
      ${cell('缓存写入', u.cacheWrite)}
    </div>
    <div class="u-total"><span>提示总量 <b>${total ? n(total) : '—'}</b></span><span>费用 <b>${u.cost ? '$' + u.cost : '未报告'}</b></span></div>
    ${hit != null ? `<div class="meter" aria-hidden="true"><i style="width:${hit}%"></i></div>
      <div class="u-total"><span>缓存命中 <b>${hit}%</b>（读取 ÷ 提示总量，展示比例，不是计费口径）</span></div>` : ''}
    <p class="rail-note">输入不含缓存读取与写入。缺失保留为「未报告」，不当作 0 参与合计。</p>
  </section>`;
}

function promptSection(r) {
  const p = r.prompt;
  if (!p) {
    return `<section class="rail-section"><h3>上下文组成</h3>
      <p class="rail-note">没有路由侧的 prompt 分析。可能是该请求未经网关规则路由，或路由记录已超出保留期。</p></section>`;
  }
  const sum = p.parts.reduce((a, x) => a + x.tokens, 0) || 1;
  const ordered = [...p.parts].sort((a, b) => b.tokens - a.tokens);
  return `<section class="rail-section">
    <h3>上下文组成<span class="grow"></span><span class="hint">${p.counted ? '总量已校准' : '本地估计'}</span></h3>
    <div class="comp-bar" aria-hidden="true">
      ${p.parts.filter(x => x.tokens > 0).map(x => `<i style="flex:${x.tokens / sum};background:${partColor(x.kind)}"></i>`).join('')}
    </div>
    <div class="comp-legend">
      ${ordered.map(x => `<span class="name"><i class="sw" style="background:${partColor(x.kind)}"></i><span>${PART_NAME[x.kind] || x.kind}</span></span>
        <span class="val">${kk(x.tokens)}</span><span class="pct">${Math.round(x.tokens / sum * 100)}%</span>`).join('')}
    </div>
    <div class="u-total" style="margin-top:8px"><span>${p.counted ? '提示总量（上游校准）' : '提示总量（本地估计）'} <b>${n(p.tokens)}</b></span><span>${p.window ? `窗口 <b>${kk(p.window)}</b>` : '窗口未知'}</span></div>
    <p class="rail-note">${p.counted
      ? '总量已由上游输入量校准，六类仍按估计比例分配，不是逐类精确计数。'
      : '总量与分类都来自本地估计，未经上游校准。'}
      ${p.window ? '' : ' 分母未知，不显示占用率。'}
      ${r.status === 'failed' ? ' 这笔最终失败：总量可能来自较早尝试，窗口取自最后尝试，两者不是同一次调用的快照。' : ''}</p>
  </section>`;
}

function routeSection(r) {
  if (!r.route) {
    return `<section class="rail-section"><h3>路由</h3><p class="rail-note">${r.via === 'hook' ? '正文回调没有 route_id，关联有歧义。' : '当前来源没有网关路由。'}</p></section>`;
  }
  const rt = r.route;
  return `<section class="rail-section">
    <h3>路由去向</h3>
    <div class="chain">
      <div class="chain-row"><dt>请求模型</dt><dd><code>${esc(rt.requested)}</code></dd></div>
      <div class="chain-row"><dt>命中规则</dt><dd><code>${esc(rt.rule)}</code></dd></div>
      <div class="chain-row"><dt>实际去向</dt><dd><code>${esc(rt.order.at(-1))}</code></dd></div>
      <div class="chain-row"><dt>上游模型名</dt><dd>${rt.served ? `<code>${esc(rt.served)}</code>` : '<span class="muted">未报告</span>'}</dd></div>
      <div class="chain-row"><dt>亲和性</dt><dd><code>why=${esc(rt.affinity)}</code></dd></div>
    </div>
    ${r.attempts && r.attempts.length > 1 ? `<div class="attempt-bar" aria-hidden="true" style="margin-top:10px">${r.attempts.map(a => `<i class="${a.status === 200 ? 'ok' : 'bad'}" style="flex:${Math.max(a.ms, 40)}"></i>`).join('')}</div>
      <div class="u-total"><span>${r.attempts.length} 次尝试</span><span>${r.attempts.map(a => `HTTP ${a.status}`).join(' → ')}</span></div>` : ''}
    <p class="rail-note">请求模型、路由组的选路、实际 provider/model 与上游返回的名字是四个值，不能挤成一个 Model。</p>
  </section>`;
}

function completenessSection(r) {
  const body = r.request ? '已收到' : '缺失';
  const ledger = r.ledger?.found ? '已关联' : '待关联（有歧义）';
  const route = r.attempts ? '已关联' : (r.via === 'hook' ? '待关联' : '当前来源不提供');
  const row = (k, v, color) => `<div class="chain-row"><dt>${k}</dt><dd><span style="color:${color}">${v}</span></dd></div>`;
  return `<section class="rail-section">
    <h3>数据完整性</h3>
    <div class="chain">
      ${row('正文回调', body, body === '已收到' ? 'var(--good)' : 'var(--bad)')}
      ${row('用量账本', ledger, r.ledger?.found ? 'var(--good)' : 'var(--warn)')}
      ${row('路由历史', route, r.attempts ? 'var(--good)' : 'var(--muted)')}
    </div>
    <p class="rail-note">三条通道各自可能缺失。这里展示的是本演示的合成状态，不代表真实接入已经完成。</p>
  </section>`;
}

function railFacts() {
  const r = currentReq();
  if (!r) return '<div class="rail-empty"><b>未选择请求</b>在中间选择一个 Request。</div>';
  return usageSection(r) + timingSection(r) + promptSection(r) + routeSection(r) + completenessSection(r);
}

function railBody() {
  const r = currentReq();
  if (!r) return '<div class="rail-empty"><b>未选择请求</b>在中间选择一个 Request。</div>';
  if (state.railTab === 'facts') return railFacts();
  if (!r.request) {
    return `<div class="rail-empty"><b>没有可读的协议内容</b>${esc(r.caveat || '这笔记录没有正文。')}</div>`;
  }
  const rows = items(r);
  const chosen = state.selected && state.selected.req === r.id ? state.selected.path : null;
  const it = rows.find(x => x.path === chosen) || rows.findLast(x => x.kind === 'USER') || rows[0];
  const i = rows.indexOf(it);
  return `<div class="body-panel">
    <div class="bp-head">
      <span class="kind ${it.kind} bp-kind">${it.kind}</span>
      <span class="bp-path">${esc(it.path)}</span>
      <span class="bp-nav">
        <button data-step="-1" aria-label="上一项" title="上一项" ${i <= 0 ? 'disabled' : ''}>↑</button>
        <button data-step="1" aria-label="下一项" title="下一项" ${i >= rows.length - 1 ? 'disabled' : ''}>↓</button>
      </span>
    </div>
    <div class="bp-meta"><span>${esc(r.id)}</span><span>·</span><span>${it.kind === 'REPLY' ? '本次回复' : it.kind === 'CALL' ? '工具调用' : it.kind === 'SCHEMA' ? '工具定义' : it.kind === 'PARAM' ? '顶层参数' : '协议内容'}</span></div>
    ${it.kind === 'PARAM' || it.kind === 'SCHEMA' || it.kind === 'CALL'
      ? `<pre class="raw" tabindex="0">${esc(it.full)}</pre>`
      : `<div class="bp-text">${it.kind === 'REPLY' ? mdToHtml(it.full) : esc(it.full)}</div>`}
    <p class="rail-note" style="margin-top:12px">内容按协议字段与消息顺序保存。工具调用与返回通过原始 ID 核对，不按名称或相邻位置配对。</p>
  </div>`;
}

function renderRail() {
  document.getElementById('rail-head').innerHTML = railHead();
  document.getElementById('rail-body').innerHTML = railBody();
  document.getElementById('rail-body').scrollTop = 0;
}

/* ---------------- 交互 ---------------- */
function updateURL() {
  const p = new URLSearchParams();
  p.set('session', state.session);
  if (state.reqId) p.set('trace', state.reqId);
  if (state.view === 'ledger') p.set('view', 'ledger');
  if (state.railTab === 'body') p.set('tab', 'body');
  history.replaceState(null, '', '?' + p.toString());
}

function renderAll() {
  ensureSelection();
  renderCrumb();
  renderFilters();
  renderSessions();
  renderMain();
  renderRail();
  updateURL();
}

function selectSession(key) {
  state.session = key;
  const rows = requestsOf(key);
  state.reqId = rows.at(-1)?.id || null;
  state.open = new Set(state.reqId ? [state.reqId] : []);
  state.selected = null;
  state.railTab = 'facts';
  state.searches = {};
  state.deltaOnly = new Set();
  state.replyOpen = false;
  renderAll();
  document.getElementById('main').scrollTop = 0;
}

function selectRequest(id) {
  const same = state.reqId === id;
  state.reqId = id;
  renderCrumb();
  // 同一笔不重建主体，否则会关闭已经展开的工具结果
  if (!same) {
    renderMain();
    renderRail();
  }
  updateURL();
}

function jumpToLedger(id) {
  state.view = 'ledger';
  state.reqId = id;
  state.open.add(id);
  state.selected = null;
  renderAll();
  requestAnimationFrame(() => {
    const el = document.querySelector(`[data-req="${CSS.escape(id)}"]`);
    if (el) el.scrollIntoView({ block:'start', behavior:'smooth' });
  });
}

function toggleRequest(id) {
  if (state.open.has(id)) state.open.delete(id);
  else state.open.add(id);
  state.reqId = id;
  state.selected = null;
  if (state.railTab === 'body' && !state.open.has(id)) state.railTab = 'facts';
  renderAll();
}

function selectItem(owner, path) {
  state.selected = { req: owner, path };
  state.railTab = 'body';
  document.querySelectorAll('[data-item]').forEach(el => el.setAttribute('aria-current',
    String(el.dataset.owner === owner && el.dataset.item === path)));
  renderRail();
}

function applyItemSearch(owner) {
  const q = (state.searches[owner] || '').trim().toLowerCase();
  document.querySelectorAll(`[data-item][data-owner="${CSS.escape(owner)}"]`).forEach(el => {
    const hit = !!q && (el.dataset.item + ' ' + el.textContent).toLowerCase().includes(q);
    el.classList.toggle('search-hit', hit);
  });
}

function applyAllItemSearches() {
  for (const id of Object.keys(state.searches)) applyItemSearch(id);
}

document.addEventListener('click', (e) => {
  const t = e.target;
  // 原生 details 折叠不触发选中
  if (t.closest('summary')) return;

  const sess = t.closest('[data-session]');
  if (sess) { selectSession(sess.dataset.session); return; }

  const agent = t.closest('[data-agent]');
  if (agent) { state.agent = agent.dataset.agent; renderFilters(); renderSessions(); return; }

  const view = t.closest('[data-view]');
  if (view) { state.view = view.dataset.view; renderMain(); updateURL(); return; }

  const ledger = t.closest('[data-ledger]');
  if (ledger) { jumpToLedger(ledger.dataset.ledger); return; }

  const select = t.closest('[data-select]');
  if (select) { selectRequest(select.dataset.select); return; }

  const toggle = t.closest('[data-toggle]');
  if (toggle) { toggleRequest(toggle.dataset.toggle); return; }

  const item = t.closest('[data-item]');
  if (item) { selectItem(item.dataset.owner, item.dataset.item); return; }

  const delta = t.closest('[data-delta]');
  if (delta) {
    if (delta.dataset.scope === 'new') state.deltaOnly.add(delta.dataset.delta);
    else state.deltaOnly.delete(delta.dataset.delta);
    state.selected = null;
    renderMain();
    return;
  }

  const rail = t.closest('[data-rail]');
  if (rail) { state.railTab = rail.dataset.rail; renderRail(); updateURL(); return; }

  const step = t.closest('[data-step]');
  if (step) {
    const r = currentReq(); if (!r?.request) return;
    const rows = items(r);
    const chosen = state.selected && state.selected.req === r.id ? state.selected.path : null;
    const i = rows.findIndex(x => x.path === chosen);
    const next = rows[Math.max(0, Math.min(rows.length - 1, (i < 0 ? 0 : i) + Number(step.dataset.step)))];
    if (next) selectItem(r.id, next.path);
    return;
  }

  const rt = t.closest('[data-reply-toggle]');
  if (rt) { state.replyOpen = !state.replyOpen; renderMain(); return; }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'sess-search') { state.query = e.target.value; renderSessions(); }
  if (e.target.dataset.itemSearch) {
    state.searches[e.target.dataset.itemSearch] = e.target.value;
    applyItemSearch(e.target.dataset.itemSearch);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea, summary')) return;
  if (e.key === 'Escape') { state.railTab = 'facts'; renderRail(); return; }
  const current = document.querySelector('.path-row[aria-current="true"]');
  if (!current) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const rows = [...document.querySelectorAll('.path-row')];
    const i = rows.indexOf(current);
    const next = rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
    if (next) { selectItem(next.dataset.owner, next.dataset.item); next.focus(); }
  }
});

const themeBtn = document.getElementById('theme-toggle');
function applyTheme() {
  if (themePref === 'system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = themePref;
  themeBtn.textContent = themePref === 'dark' ? '☾' : themePref === 'light' ? '☀' : '◐';
  themeBtn.title = `主题：${themePref === 'system' ? '跟随系统' : themePref === 'dark' ? '深色' : '浅色'}（点击切换）`;
}
themeBtn.addEventListener('click', () => {
  const order = ['system', 'light', 'dark'];
  const next = order[(order.indexOf(themePref) + 1) % order.length];
  try { localStorage.setItem('tc.theme', next); } catch {}
  themePref = next;
  applyTheme();
});

window.addEventListener('popstate', () => {
  const p = new URLSearchParams(location.search);
  state.session = p.get('session') || SESSIONS[0].key;
  state.reqId = p.get('trace');
  state.view = p.get('view') === 'ledger' ? 'ledger' : 'conversation';
  state.railTab = p.get('tab') === 'body' ? 'body' : 'facts';
  renderAll();
});

applyTheme();
ensureSelection();
if (state.reqId) state.open = new Set([state.reqId]);
renderAll();
</script>
</body>
</html>
