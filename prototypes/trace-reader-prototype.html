}

function requestBody(r, idx) {
  if (r.local) return `<div class="req-body"><div class="detail-label">请求 ${esc(r.id)} · 已读取片段（并非完整上下文）</div><pre class="raw">${esc(JSON.stringify(r.localBody,null,2))}</pre><details><summary>服务端请求详情</summary><pre class="raw">${esc(JSON.stringify(r.localDetail,null,2))}</pre></details></div>`;
  const rows = r.request ? items(r) : [];
  const fresh = newSet(r);
  const freshCount = fresh ? fresh.size : 0;
  const deltaOn = !!fresh && state.deltaOnly.has(r.id);
  const itemQuery = state.searches[r.id] || '';
  const shown = deltaOn ? rows.filter(it => it.kind === 'REPLY' || fresh.has(messageIndex(it))) : rows;
  const meta = [
    `<span class="id">${esc(r.id)}</span>`,
    `<span class="muted">${viaText(r)}</span>`,
    `<span class="muted">${esc(r.agent)}</span>`,
    r.attempts ? `<span class="muted">${r.attempts.length} 次尝试</span>` : '',
  ].filter(Boolean).join('');

  return `<div class="req-body">
    <div class="body-top">
      <span class="num muted" style="font-size:10.5px">Request ${String(idx + 1).padStart(2,'0')}</span>
      ${statusChip(r)}
      ${meta}
      <span class="grow"></span>
      ${r.caveat ? `<span class="req-flag warn" title="${esc(r.caveat)}">注意边界</span>` : ''}
    </div>
    ${r.request ? `
      <section class="section">
        <div class="section-head">
          <h3>请求结构</h3>
          <span class="count">${deltaOn ? `${shown.length - 1} / ${rows.length - 1}` : rows.length - 1} 项 + 回复</span>
          ${fresh ? `<span class="count" style="color:var(--accent)">新增消息 ${freshCount}</span>` : ''}
          <span class="grow"></span>
          ${r.request.messages && previousOf(r)?.request ? `<div class="seg" role="group" aria-label="结构范围">
            <button data-delta="${esc(r.id)}" data-scope="all" aria-pressed="${!deltaOn}">全部</button>
            <button data-delta="${esc(r.id)}" data-scope="new" aria-pressed="${deltaOn}">仅本轮新增</button>
          </div>` : ''}
          <input class="mini-search" data-item-search="${esc(r.id)}" type="search" placeholder="查找协议内容" value="${esc(itemQuery)}" aria-label="查找协议内容">
        </div>
        <div class="path-table">
          <div class="path-head"><span>#</span><span>路径</span><span>类型</span><span>内容</span><span></span></div>
          <div class="path-scroll">
            ${shown.map((it) => {
              const mi = messageIndex(it);
              const isNew = fresh ? (mi != null && fresh.has(mi)) : false;
              const sel = state.selected && state.selected.req === r.id && state.selected.path === it.path;
              return `<button class="path-row" data-item="${esc(it.path)}" data-owner="${esc(r.id)}" aria-current="${sel}" data-new="${isNew}" data-dim="${fresh && !deltaOn && !isNew && it.kind !== 'REPLY'}">
                <span class="path-idx">${String(rows.indexOf(it) + 1).padStart(2,'0')}</span>
                <span class="path-name">${esc(it.path)}</span>
                <span class="kind ${it.kind}">${it.kind}</span>
                <span class="path-preview" title="${esc(it.path)}">${esc(it.text || '（空内容）')}</span>
                <span class="path-flag">${isNew ? '新增' : ''}</span>
              </button>`;
            }).join('') || '<p class="sess-empty">当前筛选下没有内容。</p>'}
          </div>
        </div>
        ${fresh ? `<div class="delta-note"><b>本轮新增</b><span>按消息内容哈希与本会话上一笔请求比较，是派生视图。请求本身仍是全上下文重发；压缩或裁剪后，比较结果可能把旧内容也标成新增。</span></div>` : ''}
      </section>
      <section class="section">
        <div class="section-head"><h3>本次回复</h3><span class="count">合并后的回复，与请求上下文分开</span></div>
        ${replyBlock(r)}
      </section>` : `
      <section class="section">
        <div class="section-head"><h3>正文</h3></div>
        <div class="reply-card"><div class="reply-empty">
          <b>这笔记录没有正文</b>
          <span>${esc(r.caveat || (r.via === 'direct' ? 'direct 行没有正文与路由决策。' : '网关已入账，正文回调没有收到。'))}</span>
        </div></div>
      </section>`}
    <div class="disclosures">
      <details><summary>路由与尝试 · ${r.attempts ? `${r.attempts.length} 次尝试` : '不可用或待关联'}</summary><div class="d-body">${routeBlock(r)}</div></details>
      <details><summary>协议对象与阅读边界</summary><div class="d-body">${rawBlock(r)}</div></details>
    </div>
  </div>`;
}

function replyBlock(r) {
  if (!r.request) return '';
  const st = r.replyState || {};
  const calls = replyCalls(r);
  if (calls.length) {
    return `<div class="reply-card">
      <div class="reply-head">
        <span class="who">ASSISTANT</span>
        <span class="mono muted" style="font-size:10px">${esc(st.model || '模型名未报告')}</span>
        <span class="grow"></span>
        <span class="mono muted" style="font-size:10px">finish: ${esc(st.finish)}</span>
      </div>
      <div class="conv-tools"><span class="label">本响应发出的调用</span>
        ${calls.map(c => `<span class="tool-chip call"><span>${esc(c.function.name)}(${esc(c.function.arguments)})</span></span>`).join('')}
      </div>
      <p class="note" style="padding:0 12px 10px">工具结果不在本次回复里。它出现在下一笔请求的 messages 中，按 tool_call_id 对应。</p>
    </div>`;
  }
  if (!replyOf(r)) {
    return `<div class="reply-card">
      <div class="reply-head"><span class="who">ASSISTANT</span><span class="grow"></span>
        <span class="state-chip bad"><span class="d"></span>没有收到回复</span></div>
      <div class="reply-empty"><b>本次请求失败，回复为 null</b>
        <span>最近一次尝试返回 ${r.attempts?.at(-1)?.status ?? '未知状态'}。失败尝试的用量仍保留在账本里，不并入成功请求。</span></div>
    </div>`;
  }
  const t = replyText(r);
  const clipped = t.length > 520 && !state.replyOpen;
  return `<div class="reply-card">
    <div class="reply-head">
      <span class="who">ASSISTANT</span>
      <span class="mono muted" style="font-size:10px">${esc(st.model || '模型名未报告')}</span>
      <span class="grow"></span>
      <span class="mono muted" style="font-size:10px">finish: ${esc(st.finish || '未报告')}</span>
      ${st.streamed ? '<span class="mono muted" style="font-size:10px">streamed</span>' : ''}
    </div>
    <div class="reply-text ${clipped ? 'clip' : ''}">${mdToHtml(t)}</div>
    ${clipped || state.replyOpen ? `<div class="reply-actions"><button class="chip-btn" data-reply-toggle="1">${state.replyOpen ? '收起' : '展开全文'}</button></div>` : ''}
  </div>`;
}

function routeBlock(r) {
  if (!r.route) {
    return `<p class="note">${r.via === 'hook'
      ? '回调里没有 route_id。本演示保留两个候选，不按相近时间强行确定；路由结论保持未知。'
      : '当前来源没有网关路由。direct / reported 只说明这笔调用被记录，不说明它经过 magpie 路由器。'}</p>
      ${r.candidates ? `<pre class="raw">${esc(r.candidates.join('\n'))}\n\n关联状态：歧义，待核验</pre>` : ''}`;
  }
  const rt = r.route;
  const sentName = rt.order.at(-1)?.split('/')[1];
  const servedDiff = rt.served && sentName && rt.served !== sentName;
  return `<dl class="chain">
    <div class="chain-row"><dt>客户端请求</dt><dd><code>${esc(rt.requested)}</code></dd></div>
    <div class="chain-row"><dt>命中规则</dt><dd><code>${esc(rt.rule)}</code>${rt.held ? '<span class="muted"> · 回合开始时已定，回合内沿用</span>' : '<span class="muted"> · 回合内重新匹配</span>'}</dd></div>
    ${rt.classified ? `<div class="chain-row"><dt>意图分类</dt><dd><code>${esc(rt.classified.model)}</code> → <code>${esc(rt.classified.intent)}</code> · score ${rt.classified.score} · ${rt.classified.sure ? 'sure' : '不确定'} · ${rt.classified.cached ? '命中缓存' : '未命中缓存'} · ${rt.classified.ms} ms<span class="muted">（决策证据，不是路由正确率）</span></dd></div>` : ''}
    <div class="chain-row"><dt>亲和性</dt><dd><code>why=${esc(rt.affinity)}</code><span class="muted">${rt.kept ? ' · 上次应答者被排到最前' : ' · 没有沿用上次应答者'}</span>${rt.affinity === 'cache' ? '<span class="muted"> · 发送前保留缓存位置的决策，不代表本次已命中缓存</span>' : ''}</dd></div>
    <div class="chain-row"><dt>候选顺序</dt><dd class="mono" style="font-size:10px">${rt.order.map(esc).join(' → ')}</dd></div>
    <div class="chain-row"><dt>上游返回模型</dt><dd>${rt.served ? `<code>${esc(rt.served)}</code>${servedDiff ? ' <span class="req-flag warn">与发送名称不同</span>' : ''}` : '<span class="muted">未报告</span>'}</dd></div>
  </dl>
  ${r.attempts ? `<div style="margin-top:10px">
    <div class="attempt-bar" aria-hidden="true">${r.attempts.map(a => `<i class="${a.status === 200 ? 'ok' : 'bad'}" style="flex:${Math.max(a.ms, 40)}"></i>`).join('')}</div>
    ${r.attempts.map((a, i) => `<div class="attempt">
      <span class="attempt-n">${i + 1}</span>
      <span><span class="attempt-name">${esc(a.provider)} / ${esc(a.model)}</span>
        ${a.fail ? `<div class="attempt-note">${esc(a.fail)}</div>` : ''}
        ${a.net ? `<div class="breakdown"><span>网关 <b>${a.net.own} ms</b></span><span>网络 <b>${(a.net.dns||0)+(a.net.connect||0)+(a.net.tls||0)+(a.net.send||0)} ms</b></span><span>上游首字节 <b>${a.net.wait} ms</b></span></div>` : ''}
      </span>
      <span class="attempt-side">${secs(a.ms)}<span class="sc ${a.status === 200 ? 'ok' : 'bad'}">HTTP ${a.status}</span></span>
    </div>`).join('')}
  </div>` : ''}
  <p class="note" style="margin-top:8px">只显示已记录的决策与尝试。窗口过滤不保证完整留痕，无法为所有未选模型提供原因；用量条目数量也不等于尝试次数。</p>
  ${r.caveat ? `<p class="note warn" style="margin-top:6px">${esc(r.caveat)}</p>` : ''}`;
}

function rawBlock(r) {
  const reply = replyOf(r);
  const blocks = [
    ['客户端请求对象', r.request ? JSON.stringify(r.request, null, 2) : null],
    ['合并回复', reply ? JSON.stringify({id:`demo-response-${r.id}`,
      status: r.replyState?.finish === 'length' ? 'incomplete' : r.replyState?.finish === 'error' ? 'failed' : 'completed',
      model: r.replyState?.model, choices:[{message: reply}]}, null, 2) : null],
  ];
  return blocks.map(([name, obj]) => obj
    ? `<div style="margin-bottom:10px"><div class="label" style="margin-bottom:4px">${name}</div><pre class="raw" tabindex="0">${esc(obj)}</pre></div>`
    : `<div style="margin-bottom:10px"><div class="label" style="margin-bottom:4px">${name}</div><p class="note">当前来源或关联状态没有提供此对象。</p></div>`
  ).join('') + `<p class="note">这里保存的是客户端提交的协议对象，经过脱敏。hook 观察点在后续 middleware、协议转换与逐 provider 改写之前，不代表每个最终模型收到的逐字节输入。最新请求可能包含重发的历史，也可能被压缩或裁剪，不保证是完整会话。</p>`;
}

function renderMain() {
  ensureSelection();
  const rows = requestsOf(state.session);
  const main = document.getElementById('main');
  const keep = main.scrollTop;
  main.innerHTML = sessionHead() + renderSteps();
  main.scrollTop = keep;
  applyAllItemSearches();
}

/* ---------------- 右栏 ---------------- */
function bigNumbers(r) {
  const t = r.timing || {};
  const speed = (t.flow && r.usage?.out) ? r.usage.out / (t.flow / 1000) : null;
  const cells = [
    ['首字', t.ttft != null ? (t.ttft / 1000).toFixed(2) : '—', t.ttft != null ? 's' : '', 'TTFT：到第一个内容（文本、推理或工具调用）'],
    ['时长', t.ms != null ? (t.ms / 1000).toFixed(2) : '—', t.ms != null ? 's' : '', '从请求到回复结束'],
    ['输出速度', speed ? Math.round(speed) : '—', speed ? 'tok/s' : '', '输出 token ÷ 生成耗时（不含首字等待）'],
  ];
  return `<div class="rail-big">${cells.map(([k, v, u, title]) => `<div title="${esc(title)}">
    <div class="k">${k}</div><div class="v">${v}${u ? `<small>${u}</small>` : ''}</div></div>`).join('')}</div>`;
}

function railHead() {
  const r = currentReq();
  if (!r) return '<div class="rail-id">未选择请求</div>';
  const s = currentSession();
  const idx = s.requests.indexOf(r.id) + 1;
  const tool = selectedTool();
  if (tool) return `<div class="rail-id"><span class="row-label tool">工具</span><span>Request ${String(idx).padStart(2,'0')}</span><span class="grow"></span><button class="icon-btn" data-close-tool="1" aria-label="返回请求详情">×</button></div><div class="rail-title mono">${esc(tool.call.function.name)}</div><div class="detail-label" style="margin-top:5px">${esc(callSummary(tool.call))}</div><div class="rail-tabs" role="tablist">${[['overview','概览'],['params','参数'],['result','结果'],['schema','Schema']].map(([key,label]) => `<button role="tab" data-rail="${key}" aria-pressed="${state.railTab === key}">${label}</button>`).join('')}</div>`;
  return `<div class="rail-id"><span>Request ${String(idx).padStart(2,'0')}</span><span class="muted">·</span><span>${esc(r.at)}</span><span class="grow"></span>${statusChip(r)}</div>
    <div class="rail-title">${esc(r.title)}</div>
    ${bigNumbers(r)}
    <div class="rail-tabs" role="tablist">
      <button role="tab" data-rail="facts" aria-pressed="${state.railTab === 'facts'}">读数</button>
      <button role="tab" data-rail="body" aria-pressed="${state.railTab === 'body'}">正文</button>
      <button role="tab" data-rail="tools" aria-pressed="${state.railTab === 'tools'}">工具${replyCalls(r).length ? ' '+replyCalls(r).length : ''}</button>
      <button role="tab" data-rail="route" aria-pressed="${state.railTab === 'route'}">路由</button>
    </div>`;
}

function timingSection(r) {
  const t = r.timing || {};
  if (t.ms == null) {
    return `<section class="rail-section"><h3>时间构成</h3>
      <p class="rail-note">${r.via === 'through' ? '上游没有报告本笔耗时，或正文回调缺失，首字时间不可得。' : '当前来源不提供网关计时。'}</p></section>`;
  }
  const ttft = t.ttft;
  const ms = t.ms;
  const ft = t.firstText;
  const waitPct = ttft != null ? Math.min(100, ttft / ms * 100) : 100;
  const tickPct = ft != null && ms ? Math.min(100, ft / ms * 100) : null;
  const speed = (t.flow && r.usage?.out) ? Math.round(r.usage.out / (t.flow / 1000)) : null;
  const rows = [
    ttft != null
      ? `<span class="k"><i class="sw" style="background:var(--line-strong)"></i>首字前（排队 + 网络 + 首 token）</span><span class="v">${secs(ttft)}</span>`
      : `<span class="k"><i class="sw" style="background:var(--line-strong)"></i>首字前</span><span class="v">未报告</span>`,
    ttft != null
      ? `<span class="k"><i class="sw" style="background:var(--accent);opacity:.62"></i>首字后生成</span><span class="v">${secs(ms - ttft)}</span>`
      : '',
    `<span class="k"><i class="sw" style="background:var(--text);width:2px;height:9px;border-radius:1px"></i>首个文本</span><span class="v">${ft != null ? secs(ft) : replyOf(r) ? '无文本（工具调用或非流式）' : '没有收到'}</span>`,
    speed ? `<span class="k">输出速度</span><span class="v">${speed} tok/s</span>` : '',
  ].filter(Boolean).join('');
  const modeHint = r.status === 'failed' ? '失败' : !replyOf(r) ? '无正文' : r.replyState?.streamed ? 'streamed' : '非流式';
  return `<section class="rail-section">
    <h3>时间构成<span class="grow"></span><span class="hint">${modeHint}</span></h3>
    <div class="time-wrap">
      <div class="time-bar" aria-hidden="true">
        <i class="wait" style="width:${waitPct}%"></i><i class="gen" style="width:${100 - waitPct}%"></i>
        ${tickPct != null ? `<span class="time-tick" style="left:${tickPct}%"></span>` : ''}
      </div>
      <div class="time-legend">${rows}</div>
    </div>
    ${explainer(r.status === 'failed'
      ? '这笔请求最终失败，只有总耗时；首字与生成速度不可得。'
      : !replyOf(r)
        ? '正文回调缺失，总耗时来自账本；首字与生成速度不可得。'
        : '首字是到第一个内容。首个文本可以更晚；模型请求耗时不代表工具执行耗时。')}
  </section>`;
}

function usageSection(r) {
  const u = r.usage || {};
  const total = (u.in || 0) + (u.cacheRead || 0) + (u.cacheWrite || 0);
  const cell = (label, val) => `<div class="u-cell"><div class="k">${label}</div>${val == null
    ? '<div class="v miss">未报告</div>'
    : `<div class="v">${n(val)}</div>`}</div>`;
  const hit = u.cacheRead != null && total ? Math.round(u.cacheRead / total * 100) : null;
  return `<section class="rail-section">
    <h3>用量<span class="grow"></span><span class="hint">上游报告</span></h3>
    <div class="u-grid">
      ${cell('输入（不含缓存）', u.in)}
      ${cell('输出', u.out)}
      ${cell('缓存读取', u.cacheRead)}
      ${cell('缓存写入', u.cacheWrite)}
    </div>
    <div class="u-total"><span>提示总量 <b>${total ? n(total) : '—'}</b></span><span>费用 <b>${money(u.cost)}</b></span></div>
    ${hit != null ? `<div class="meter" aria-hidden="true"><i style="width:${hit}%"></i></div>
      <div class="u-total"><span>缓存命中 <b>${hit}%</b>（读取 ÷ 提示总量，展示比例，不是计费口径）</span></div>` : ''}
    ${explainer('输入不含缓存读取与写入。缺失保留为未报告，不当作 0 参与合计。')}
  </section>`;
}

function promptSection(r) {
  const p = r.prompt;
  if (!p) {
    return `<section class="rail-section"><h3>上下文组成</h3>
      <p class="rail-note">没有路由侧的 prompt 分析。可能是该请求未经网关规则路由，或路由记录已超出保留期。</p></section>`;
  }
  const sum = p.parts.reduce((a, x) => a + x.tokens, 0) || 1;
  const ordered = [...p.parts].sort((a, b) => b.tokens - a.tokens);
  return `<section class="rail-section">
    <h3>上下文组成<span class="grow"></span><span class="hint">${p.counted ? '总量已校准' : '本地估计'}</span></h3>
    <div class="comp-bar" aria-hidden="true">
      ${p.parts.filter(x => x.tokens > 0).map(x => `<i style="flex:${x.tokens / sum};background:${partColor(x.kind)}"></i>`).join('')}
    </div>
    <div class="comp-legend">
      ${ordered.map(x => `<span class="name"><i class="sw" style="background:${partColor(x.kind)}"></i><span>${PART_NAME[x.kind] || x.kind}</span></span>
        <span class="val">${kk(x.tokens)}</span><span class="pct">${Math.round(x.tokens / sum * 100)}%</span>`).join('')}
    </div>
    <div class="u-total" style="margin-top:8px"><span>${p.counted ? '提示总量（上游校准）' : '提示总量（本地估计）'} <b>${n(p.tokens)}</b></span><span>${p.window ? `窗口 <b>${kk(p.window)}</b>` : '窗口未知'}</span></div>
    ${explainer(`${p.counted ? '总量已由上游校准，各类仍按估计比例分配。' : '总量与分类来自本地估计。'}${p.window ? '' : '窗口未知，不显示占用率。'}${r.status === 'failed' ? '最终失败：提示总量与窗口可能来自不同尝试。' : ''}`)}
  </section>`;
}

function routeSection(r) {
  if (!r.route) {
    return `<section class="rail-section"><h3>路由</h3><p class="rail-note">${r.via === 'hook' ? '正文回调没有 route_id，关联有歧义。' : '当前来源没有网关路由。'}</p></section>`;
  }
  const rt = r.route;
  return `<section class="rail-section">
    <h3>路由去向</h3>
    <div class="chain">
      <div class="chain-row"><dt>请求模型</dt><dd><code>${esc(rt.requested)}</code></dd></div>
      <div class="chain-row"><dt>命中规则</dt><dd><code>${esc(rt.rule)}</code></dd></div>
      <div class="chain-row"><dt>实际去向</dt><dd><code>${esc(rt.order.at(-1))}</code></dd></div>
      <div class="chain-row"><dt>上游模型名</dt><dd>${rt.served ? `<code>${esc(rt.served)}</code>` : '<span class="muted">未报告</span>'}</dd></div>
      <div class="chain-row"><dt>亲和性</dt><dd><code>why=${esc(rt.affinity)}</code></dd></div>
    </div>
    ${r.attempts && r.attempts.length > 1 ? `<div class="attempt-bar" aria-hidden="true" style="margin-top:10px">${r.attempts.map(a => `<i class="${a.status === 200 ? 'ok' : 'bad'}" style="flex:${Math.max(a.ms, 40)}"></i>`).join('')}</div>
      <div class="u-total"><span>${r.attempts.length} 次尝试</span><span>${r.attempts.map(a => `HTTP ${a.status}`).join(' → ')}</span></div>` : ''}
    <p class="rail-note">请求模型、路由组的选路、实际 provider/model 与上游返回的名字是四个值，不能挤成一个 Model。</p>
  </section>`;
}

function completenessSection(r) {
  const body = r.request ? '已收到' : '缺失';
  const ledger = r.ledger?.found ? '已关联' : '待关联（有歧义）';
  const route = r.attempts ? '已关联' : (r.via === 'hook' ? '待关联' : '当前来源不提供');
  const row = (k, v, color) => `<div class="chain-row"><dt>${k}</dt><dd><span style="color:${color}">${v}</span></dd></div>`;
  return `<section class="rail-section">
    <h3>数据完整性</h3>
    <div class="chain">
      ${row('正文回调', body, body === '已收到' ? 'var(--good)' : 'var(--bad)')}
      ${row('用量账本', ledger, r.ledger?.found ? 'var(--good)' : 'var(--warn)')}
      ${row('路由历史', route, r.attempts ? 'var(--good)' : 'var(--muted)')}
    </div>
    <p class="rail-note">三条通道各自可能缺失。这里展示的是本演示的合成状态，不代表真实接入已经完成。</p>
  </section>`;
}

function railFacts() {
  const r = currentReq();
  if (r?.local) return `${localReader.renderContext(r)}<section class="rail-section"><h3>本次回复</h3>${localReader.renderResponse(r)}</section>${usageSection(r)}<section class="rail-section"><h3>请求状态与身份</h3><div class="detail-value">请求 ${esc(r.id)} · ${esc(r.localDetail.model_served || r.localDetail.model_requested)}
正文 ${esc(r.localDetail.body_state)} · 派生 ${esc(r.localDetail.derived_state)}
前驱关系 ${esc(r.localDetail.prev_relation)}
首个文本 ${secs(r.timing.firstText)}
actor ${esc(r.localDetail.actor || '未知')}</div></section>`;
  if (!r) return '<div class="rail-empty"><b>未选择请求</b>在中间选择一个 Request。</div>';
  return `<section class="rail-section"><h3>本次回复</h3><div class="detail-value">${esc(replyText(r) ? replyText(r).slice(0,260) : replyCalls(r).length ? replyLabel(r) : r.request ? '没有收到回复' : '正文未收到')}</div>${replyText(r).length > 260 ? '<button class="tool-link" data-rail="body">阅读全文 →</button>' : ''}</section>` + usageSection(r) + timingSection(r) + promptSection(r) + completenessSection(r);
}

function railBody() {
  const r = currentReq();
  if (!r) return '<div class="rail-empty"><b>未选择请求</b>在中间选择一个 Request。</div>';
  const tool = selectedTool();
  if (tool) return toolInspector(tool);
  if (state.railTab === 'route' && r.local) return `<section class="rail-section"><h3>请求详情中的路由证据</h3><pre class="raw">${esc(JSON.stringify(r.localDetail,null,2))}</pre></section>`;
  if (state.railTab === 'route') return `<section class="rail-section"><h3>路由与尝试</h3>${routeBlock(r)}</section>`;
  if (state.railTab === 'tools') {
    const calls = replyCalls(r);
    return `<section class="rail-section"><h3>本次回复发起的工具调用</h3>${calls.length ? calls.map(c => `<button class="tool-chip call" style="margin-bottom:8px" data-tool-owner="${esc(r.id)}" data-tool-id="${esc(c.id)}"><span>${esc(callSummary(c))}</span></button>`).join('') : '<p class="note">本次回复没有工具调用。</p>'}</section>`;
  }
  if (state.railTab === 'facts') return railFacts();
  if (!r.request && !r.local) {
    return `<div class="rail-empty"><b>没有可读的协议内容</b>${esc(r.caveat || '这笔记录没有正文。')}</div>`;
  }
  const rows = items(r);
  const chosen = state.selected && state.selected.req === r.id ? state.selected.path : null;
  const it = rows.find(x => x.path === chosen) || rows.findLast(x => x.kind === 'USER') || rows[0];
  const i = rows.indexOf(it);
  return `<div class="body-panel">
    <div class="bp-head">
      <span class="kind ${it.kind} bp-kind">${it.kind}</span>
      <span class="bp-path">${esc(it.path)}</span>
      <span class="bp-nav">
        <button data-step="-1" aria-label="上一项" title="上一项" ${i <= 0 ? 'disabled' : ''}>↑</button>
        <button data-step="1" aria-label="下一项" title="下一项" ${i >= rows.length - 1 ? 'disabled' : ''}>↓</button>
      </span>
    </div>
    <div class="bp-meta"><span>${esc(r.id)}</span><span>·</span><span>${it.kind === 'REPLY' ? '本次回复' : it.kind === 'CALL' ? '工具调用' : it.kind === 'SCHEMA' ? '工具定义' : it.kind === 'PARAM' ? '顶层参数' : '协议内容'}</span></div>
    ${it.kind === 'PARAM' || it.kind === 'SCHEMA' || it.kind === 'CALL'
      ? `<pre class="raw" tabindex="0">${esc(it.full)}</pre>`
      : `<div class="bp-text">${it.kind === 'REPLY' ? mdToHtml(it.full) : esc(it.full)}</div>`}
    <p class="rail-note" style="margin-top:12px">内容按协议字段与消息顺序保存。工具调用与返回通过原始 ID 核对，不按名称或相邻位置配对。</p>
  </div>`;
}

let lastRailRequest = null;
function renderRail() {
  const rail = document.getElementById('rail-body');
  const same = lastRailRequest === state.reqId;
  const keep = same ? rail.scrollTop : 0;
  const openCapabilities = same ? [...rail.querySelectorAll('.cap-section details')].map(node=>node.open) : [];
  document.getElementById('rail-head').innerHTML = railHead();
  rail.innerHTML = railBody();
  rail.querySelectorAll('.cap-section details').forEach((node,i)=>{node.open=!!openCapabilities[i];});
  rail.scrollTop = keep;
  lastRailRequest = state.reqId;
}

/* ---------------- 交互 ---------------- */
function updateURL() {
  const p = new URLSearchParams(location.search);
  p.delete('variant'); p.delete('view');
  p.set('session', state.session);
  if (state.reqId) p.set('trace', state.reqId);
  if (['body','tools','route'].includes(state.railTab)) p.set('tab', state.railTab);
  history.replaceState(null, '', '?' + p.toString());
}

function renderAll() {
  ensureSelection();
  renderCrumb();
  renderFilters();
  renderSessions();
  renderMain();
  renderRail();
  updateURL();
}

let sessionLoad = 0;
async function selectSession(key) {
  const turn = ++sessionLoad;
  if (localMode && !requestsOf(key).length) {
    document.getElementById('main').textContent = '正在读取本机会话…';
    try {
      await localReader.load(SESSIONS.find(s=>s.key===key));
      Object.assign(REQUESTS, localReader.requests);
    } catch (error) {toast(error.message); renderMain(); return;}
    if (turn !== sessionLoad) return;
  }
  state.session = key;
  const rows = requestsOf(key);
  state.reqId = rows.at(-1)?.id || null;
  resetTimeline();
  state.toolSelection = null;
  state.selected = null;
  state.railTab = 'facts';
  state.searches = {};
  state.deltaOnly = new Set();
  state.replyOpen = false;
  renderAll();
  document.getElementById('main').scrollTop = 0;
}

function selectRequest(id) {
  const same = state.reqId === id && state.toolSelection === null;
  state.reqId = id;
  state.toolSelection = null;
  if (!['facts','body','tools','route'].includes(state.railTab)) state.railTab = 'facts';
  renderCrumb();
  // 同一笔不重建主体，否则会关闭已经展开的工具结果
  if (!same) {
    renderMain();
    renderRail();
  }
  updateURL();
}

function toggleRequest(id) {
  state.toolSelection = null;
  if (!['facts','body','tools','route'].includes(state.railTab)) state.railTab = 'facts';
  if (state.open.has(id)) state.open.delete(id);
  else state.open.add(id);
  state.reqId = id;
  state.selected = null;
  if (state.railTab === 'body' && !state.open.has(id)) state.railTab = 'facts';
  renderAll();
}

function selectItem(owner, path) {
  state.reqId = owner;
  state.toolSelection = null;
  state.selected = { req: owner, path };
  state.railTab = 'body';
  document.querySelectorAll('[data-item]').forEach(el => el.setAttribute('aria-current',
    String(el.dataset.owner === owner && el.dataset.item === path)));
  renderRail();
}

function applyItemSearch(owner) {
  const q = (state.searches[owner] || '').trim().toLowerCase();
  document.querySelectorAll(`[data-item][data-owner="${CSS.escape(owner)}"]`).forEach(el => {
    const hit = !!q && (el.dataset.item + ' ' + el.textContent).toLowerCase().includes(q);
    el.classList.toggle('search-hit', hit);
  });
}

function applyAllItemSearches() {
  for (const id of Object.keys(state.searches)) applyItemSearch(id);
}

document.addEventListener('click', async (e) => {
  const t = e.target;
  if (t.closest('#load-earlier')) {loadEarlier(); return;}
  if (t.closest('#jump-latest')) {locateRequest(requestsOf(state.session).at(-1).id); return;}
  const stepExpand = t.closest('[data-step-expand]');
  if (stepExpand) {
    const key = stepExpand.dataset.stepExpand;
    if (localMode && !state.stepOpen.has(key)) {
      const step = currentSession().requests.flatMap(id=>REQUESTS[id]?.localSteps || []).find(s=>s.key===key);
      if (step?.call) {
        stepExpand.disabled = true;
        try {await localReader.result(step.call);} catch (error) {toast(error.message); stepExpand.disabled=false; return;}
        if (!document.contains(stepExpand)) return;
      }
    }
    state.stepOpen.has(key) ? state.stepOpen.delete(key) : state.stepOpen.add(key);
    renderMain(); return;
  }
  const structure = t.closest('[data-structure] > summary');
  if (structure) {
    e.preventDefault();
    const row = REQUESTS[structure.parentElement.dataset.structure];
    row.structure.open = !row.structure.open;
    const load = row.structure.open && row.structure.entries.length === 0 && !row.structure.loading;
    if (load) {
      const pending = localReader.loadStructure(row);
      renderRail();
      await pending;
      if (state.reqId === row.id) renderRail();
    } else renderRail();
    return;
  }
  const more = t.closest('[data-structure-more]');
  if (more) {
    const row = REQUESTS[more.dataset.structureMore];
    const pending = localReader.loadStructure(row); renderRail(); await pending;
    if (state.reqId === row.id) renderRail();
    return;
  }
  const back = t.closest('[data-structure-back]');
  if (back) {REQUESTS[back.dataset.structureBack].structure.selected=null; renderRail(); return;}
  const message = t.closest('.rail-structure [data-msg]');
  if (message) {currentReq().structure.selected=Number(message.dataset.msg); renderRail(); return;}
  const copyMessage = t.closest('.rail-structure [data-copy-msg]');
  if (copyMessage) {
    const entry = currentReq().structure.entries.find(item=>item.ord===Number(copyMessage.dataset.copyMsg));
    const text = localReader.messageCopyText(entry);
    try {await navigator.clipboard.writeText(text); toast('已复制消息原文');} catch {copyFallback(text);}
    return;
  }
  // 原生 details 折叠不触发选中
  if (t.closest('summary')) return;
  const copy = t.closest('[data-copy-session]');
  if (copy) {
    if (navigator.clipboard) navigator.clipboard.writeText(copy.dataset.copySession).then(() => toast('已复制完整 Session ID')).catch(() => copyFallback(copy.dataset.copySession));
    else copyFallback(copy.dataset.copySession);
    return;
  }
  const locate = t.closest('[data-locate]');
  if (locate) {locateRequest(locate.dataset.locate); return;}
  const tool = t.closest('[data-tool-owner]');
  if (tool) {
    if (tool.dataset.localResult) {
      const owner=REQUESTS[tool.dataset.toolOwner];
      const call=replyCalls(owner).find(item=>item.id===tool.dataset.toolId);
      tool.disabled=true;
      try {await localReader.result(call);} catch(error) {toast(error.message);tool.disabled=false;return;}
      if (state.reqId !== owner.id) return;
      selectTool(owner.id,call.id);state.railTab='result';renderRail();
    } else selectTool(tool.dataset.toolOwner, tool.dataset.toolId);
    return;
  }
  if (t.closest('[data-close-tool]')) {state.toolSelection = null; state.railTab = 'facts'; renderAll(); return;}
  const stepBody = t.closest('[data-step-body]');
  if (stepBody) {selectRequest(stepBody.dataset.stepBody); selectItem(stepBody.dataset.stepBody,stepBody.dataset.stepPath); return;}

  const sess = t.closest('[data-session]');
  if (sess) { selectSession(sess.dataset.session); return; }

  const agent = t.closest('[data-agent]');
  if (agent) { state.agent = agent.dataset.agent; renderFilters(); renderSessions(); return; }

  const select = t.closest('[data-select]');
  if (select) { selectRequest(select.dataset.select); return; }

  const toggle = t.closest('[data-toggle]');
  if (toggle) { toggleRequest(toggle.dataset.toggle); return; }

  const item = t.closest('[data-item]');
  if (item) { selectItem(item.dataset.owner, item.dataset.item); return; }

  const delta = t.closest('[data-delta]');
  if (delta) {
    if (delta.dataset.scope === 'new') state.deltaOnly.add(delta.dataset.delta);
    else state.deltaOnly.delete(delta.dataset.delta);
    state.selected = null;
    renderMain();
    return;
  }

  const rail = t.closest('[data-rail]');
  if (rail) { state.railTab = rail.dataset.rail; renderRail(); updateURL(); return; }

  const step = t.closest('[data-step]');
  if (step) {
    const r = currentReq(); if (!r?.request) return;
    const rows = items(r);
    const chosen = state.selected && state.selected.req === r.id ? state.selected.path : null;
    const i = rows.findIndex(x => x.path === chosen);
    const next = rows[Math.max(0, Math.min(rows.length - 1, (i < 0 ? 0 : i) + Number(step.dataset.step)))];
    if (next) selectItem(r.id, next.path);
    return;
  }

  const rt = t.closest('[data-reply-toggle]');
  if (rt) { state.replyOpen = !state.replyOpen; renderMain(); return; }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'sess-search') { state.query = e.target.value; renderSessions(); }
  if (e.target.dataset.itemSearch) {
    state.searches[e.target.dataset.itemSearch] = e.target.value;
    applyItemSearch(e.target.dataset.itemSearch);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea, summary, [contenteditable], [role="separator"]')) return;
  if (e.key === 'Escape') { state.toolSelection = null; state.railTab = 'facts'; renderRail(); return; }
  const current = document.querySelector('.path-row[aria-current="true"]');
  if (!current) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const rows = [...document.querySelectorAll('.path-row')];
    const i = rows.indexOf(current);
    const next = rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
    if (next) { selectItem(next.dataset.owner, next.dataset.item); next.focus(); }
  }
});

const themeBtn = document.getElementById('theme-toggle');
function applyTheme() {
  if (themePref === 'system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = themePref;
  themeBtn.textContent = themePref === 'dark' ? '☾' : themePref === 'light' ? '☀' : '◐';
  themeBtn.title = `主题：${themePref === 'system' ? '跟随系统' : themePref === 'dark' ? '深色' : '浅色'}（点击切换）`;
}
themeBtn.addEventListener('click', () => {
  const order = ['system', 'light', 'dark'];
  const next = order[(order.indexOf(themePref) + 1) % order.length];
  try { localStorage.setItem('tc.theme', next); } catch {}
  themePref = next;
  applyTheme();
});

window.addEventListener('popstate', () => {
  const p = new URLSearchParams(location.search);
  state.session = p.get('session') || SESSIONS[0].key;
  state.reqId = p.get('trace');
  resetTimeline();
  if (state.reqId) revealRequest(state.reqId);
  state.railTab = ['body','tools','route'].includes(p.get('tab')) ? p.get('tab') : 'facts';
  state.toolSelection = null;
  renderAll();
});

function copyFallback(text) {
  const field = document.createElement('textarea');
  field.value = text; field.readOnly = true; field.style.position = 'fixed'; field.style.inset = '20px 16px auto';
  document.body.append(field); field.focus(); field.select();
  toast('复制受限，已选中 Session ID，可按 ⌘C / Ctrl+C');
  field.addEventListener('blur', () => field.remove(), {once:true});
}
function syncPanelButtons() {
  for (const [id, cls, name] of [['sidebar-toggle','sidebar-collapsed','会话栏'],['inspector-toggle','inspector-collapsed','详情栏']]) {
    const button = document.getElementById(id);
    const closed = document.body.classList.contains(cls);
    button.setAttribute('aria-expanded', String(!closed));
    button.setAttribute('aria-label', `${closed ? '展开' : '收起'}${name}`);
    button.title = button.getAttribute('aria-label');
  }
}
document.getElementById('sidebar-toggle').addEventListener('click', () => {document.body.classList.toggle('sidebar-collapsed'); syncPanelButtons();});
document.getElementById('inspector-toggle').addEventListener('click', () => {document.body.classList.toggle('inspector-collapsed'); syncPanelButtons();});
const resizer = document.getElementById('inspector-resize');
function resizeInspector(width) {
  const sidebar = document.body.classList.contains('sidebar-collapsed') ? 0 : document.querySelector('.col-sessions').getBoundingClientRect().width;
  const limit = Math.min(640, Math.max(280, innerWidth - sidebar - 420));
  const value = Math.round(Math.max(280, Math.min(limit,width)));
  document.documentElement.style.setProperty('--inspector-width', `${value}px`);
  resizer.setAttribute('aria-valuenow',String(value));
  resizer.setAttribute('aria-valuemax',String(limit));
}
resizer.addEventListener('pointerdown', e => {resizer.setPointerCapture(e.pointerId);});
resizer.addEventListener('pointermove', e => {if (resizer.hasPointerCapture(e.pointerId)) resizeInspector(innerWidth-e.clientX);});
resizer.addEventListener('pointerup', e => {if (resizer.hasPointerCapture(e.pointerId)) resizer.releasePointerCapture(e.pointerId);});
resizer.addEventListener('dblclick', () => {document.documentElement.style.removeProperty('--inspector-width'); resizer.setAttribute('aria-valuenow',String(Math.round(document.querySelector('.col-rail').getBoundingClientRect().width)));});
resizer.addEventListener('keydown', e => {if (['ArrowLeft','ArrowRight'].includes(e.key)) {e.preventDefault(); resizeInspector(document.querySelector('.col-rail').getBoundingClientRect().width + (e.key === 'ArrowLeft' ? 20 : -20));}});
window.addEventListener('resize', () => {if (innerWidth > 1000 && document.documentElement.style.getPropertyValue('--inspector-width')) resizeInspector(parseInt(document.documentElement.style.getPropertyValue('--inspector-width')));});

applyTheme();
syncPanelButtons();
ensureSelection();
resetTimeline();
if (state.reqId) revealRequest(state.reqId);
renderAll();
</script>
</body>
</html>
