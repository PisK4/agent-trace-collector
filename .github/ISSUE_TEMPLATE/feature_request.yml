name: Feature request
description: Propose a capability or a change in behaviour
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This project is deliberately narrow. Read *Scope and non-goals* in the [README](https://github.com/PisK4/agent-trace-collector#scope-and-non-goals) first — export, alerting, dashboards, multi-machine aggregation and evaluation are out of scope by design, and proposals in those directions will be closed.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you cannot answer or do today. Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: How you would change the collector or the interface. Rough is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including whether an observability platform already covers this.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ingestion (magpie / OTLP)
        - Storage or derivation
        - Reading interface
        - Maintenance and operations
        - Documentation
        - Other
    validations:
      required: true